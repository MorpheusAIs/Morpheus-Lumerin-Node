services:
  proxy-router:
    image: ghcr.io/morpheusais/morpheus-lumerin-node-tee:latest
    restart: unless-stopped
    ports:
      - 3333:3333
    volumes:
      - proxy_data:/app/data
    environment:
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - ETH_NODE_ADDRESS=${ETH_NODE_ADDRESS}
      - MODELS_CONFIG_CONTENT=${MODELS_CONFIG_CONTENT}
      - WEB_PUBLIC_URL=${WEB_PUBLIC_URL:-https://localhost}
      - COOKIE_CONTENT=${COOKIE_CONTENT:-admin:admin}
    env_file:
      - usr/.env
    networks:
      - traefik
  traefik:
    # Routing is declared statically via the file provider below. SecretVM
    # rejects a docker.sock bind (breaks VM isolation), so the Docker provider
    # and service labels are not used.
    image: traefik:v2.10
    command:
      - --api.insecure=false
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.options=default@file
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    ports:
      - 443:443
    volumes:
      - /mnt/secure/cert:/certs:ro
    networks:
      - traefik
    configs:
      - source: tls_config
        target: /etc/traefik/dynamic/tls.yml
      - source: routes_config
        target: /etc/traefik/dynamic/routes.yml
    env_file:
      - usr/.env
volumes:
  proxy_data: null
networks:
  traefik:
    driver: bridge
configs:
  tls_config:
    content: |-
      tls:
        certificates:
          - certFile: /certs/secret_vm_fullchain.pem
            keyFile: /certs/secret_vm_private.pem
        stores:
          default:
            defaultCertificate:
              certFile: /certs/secret_vm_fullchain.pem
              keyFile: /certs/secret_vm_private.pem
  routes_config:
    content: |-
      http:
        routers:
          proxy-router:
            rule: PathPrefix(`/`)
            entryPoints:
              - websecure
            tls: {}
            service: proxy-router
        services:
          proxy-router:
            loadBalancer:
              servers:
                - url: http://proxy-router:8082
