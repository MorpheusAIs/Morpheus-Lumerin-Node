name: Tests

# Fast correctness gate, deliberately kept separate from build.yml.
#
# build.yml is scoped to `github.repository == 'MorpheusAIs/Morpheus-Lumerin-Node'`
# and only fires on main/test/dev/cicd branches, so on a fork it never runs at
# all — and it does not execute a single test in ~3.6k lines. This workflow has
# no repository guard and runs on every push and pull request, so contributors
# and forks get feedback before anything is merged.

on:
  push:
    branches: ['**']
    paths:
      - 'proxy-router/**'
      - 'ui-desktop/**'
      - 'cli/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'proxy-router/**'
      - 'ui-desktop/**'
      - 'cli/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  go:
    name: proxy-router (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: proxy-router/go.mod
          cache-dependency-path: proxy-router/go.sum

      - name: Verify the module builds
        working-directory: proxy-router
        run: go build ./...

      # Advisory, for the same reason as the gofmt step below. `go vet ./...`
      # reports eight findings on pristine upstream code: an unkeyed
      # `lib.BigInt` literal in system/auth.go, a discarded
      # `context.WithTimeout` cancel and a `metadata.FileCID = metadata.FileCID`
      # self-assignment in proxyapi/ipfs_manager.go, and five unreachable blocks
      # sitting behind deliberate `return`/`t.Skip` stubs. None of them are
      # introduced by this branch, and fixing them would pull a repo-health PR
      # into files it has no business touching.
      #
      # This does not weaken the gate that matters. Compile errors are still
      # blocking: `go build ./...` above covers the packages and
      # `go test -race ./...` below covers the test files.
      - name: go vet (advisory)
        working-directory: proxy-router
        run: |
          if output=$(go vet ./... 2>&1); then
            echo "go vet is clean."
          else
            echo "::warning::go vet reported findings:"
            echo "$output"
          fi

      # Advisory, not blocking. The repo's existing formatting state has not been
      # audited, and a gate that is red from day one just teaches everyone to
      # ignore CI. Promote this to a hard failure once `gofmt -l` is clean.
      - name: Check formatting (advisory)
        working-directory: proxy-router
        run: |
          unformatted=$(gofmt -l . | grep -v '/bindings/' || true)
          if [ -n "$unformatted" ]; then
            echo "::warning::These files are not gofmt-formatted:"
            echo "$unformatted"
          else
            echo "All files are gofmt-clean."
          fi

      # Note: the `test/` package holds live-network integration tests behind
      # the `integration` build tag; they need a local Ollama and are not run
      # here. See the header comment in those files.
      - name: Run tests
        working-directory: proxy-router
        run: go test -race ./...

  cli:
    name: cli (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Verify the module builds
        working-directory: cli
        run: go build ./...

      - name: Run tests
        working-directory: cli
        run: go test ./...

  ui:
    name: ui-desktop (TypeScript/React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # yarn, to match the release jobs in build.yml — mixing package managers
      # between the test and build pipelines is how you get "passes CI, fails on
      # release".
      # Node 22, not 20: @testing-library/jest-dom@6 declares `engines.node
      # >=22`, so yarn refuses to install on 20 ("Found incompatible module")
      # and the job dies before a single test runs. The app's own floor is
      # unchanged — package.json still says `engines.node >=20`; this is the
      # test toolchain only.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: ui-desktop/yarn.lock

      # Note: no --frozen-lockfile here, unlike the release jobs. Unit tests
      # should keep running when someone adds a dependency without having
      # regenerated the lockfile yet; the release build is where lockfile
      # exactness is enforced. Electron's postinstall is skipped because the
      # unit tests never launch Electron and the download is slow and flaky.
      - name: Install dependencies
        working-directory: ui-desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: yarn install --network-timeout 600000 --ignore-scripts

      # yarn 1 does not auto-install peer dependencies (npm 7+ does), so a
      # missing peer shows up only as a confusing runtime "Cannot find package"
      # once the suite is already running. Fail early with a clear message.
      - name: Check for unmet peer dependencies
        working-directory: ui-desktop
        run: |
          missing=0
          for pkg in @testing-library/dom @testing-library/react @testing-library/jest-dom vitest jsdom; do
            if [ ! -d "node_modules/$pkg" ]; then
              echo "::error::missing dependency: $pkg"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "All test dependencies present."
          exit $missing

      - name: Run unit tests
        working-directory: ui-desktop
        run: yarn test

  # Guard against a regression to two competing lockfiles. yarn.lock is
  # authoritative (build.yml installs with `yarn --frozen-lockfile`); the stale
  # package-lock.json has been removed. With both present, CI and a developer
  # running `npm install` can silently resolve different dependency trees.
  lockfiles:
    name: Lockfile hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if ui-desktop has competing lockfiles
        run: |
          if [ -f ui-desktop/package-lock.json ] && [ -f ui-desktop/yarn.lock ]; then
            echo "::error::ui-desktop contains BOTH package-lock.json and yarn.lock."
            echo "yarn.lock is authoritative; remove package-lock.json."
            exit 1
          fi
