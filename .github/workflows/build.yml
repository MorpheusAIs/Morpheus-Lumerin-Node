name: CI-CD
# CI/CD Pipeline for Morpheus Lumerin Node
# 
# Branch Strategy:
#   • dev: Build and test only (no deployment)
#   • test: Build, test, and deploy to AWS DEV (Titan dev + Morpheus C-Node + Morpheus P-Node + SecretVM test)
#   • main: Build, test, create release, and deploy to AWS PRD (Titan lmn + Morpheus C/P-Nodes + SecretVM prod)
#
# Key Features:
#   • Optimized Docker builds with GitHub Actions caching
#   • Multi-platform container images (linux/amd64, linux/arm64)
#   • Cross-platform executables (Linux, macOS, Windows)
#   • Automated deployments to AWS Environments via GitHub Actions (Titan and Morpheus)
#   • Health check verification with version matching

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create updated Morpheus-Lumerin-Node release"
        required: true
        type: boolean
      build_all_os:
        description: "Build all OS & container image"
        required: true
        type: boolean
      create_deployment:
        description: "Deploy to hosted environments"
        required: true
        type: boolean
      cnode_rehydration_wait_secs:
        description: "Seconds to hold traffic off the new C-Node after it's up, to let BadgerDB session rehydration complete (default 90)"
        required: false
        type: string
        default: "90"

  push:
    branches:
      - main
      - test
      - dev
      - cicd/*

    paths:
      - ".github/**"
      - "!.github/workflows/docs.yml"
      - "ui-desktop/**"
      - "proxy-router/**"
      - "cli/**"

  # pull_request:
  #   types: [opened, reopened, synchronize]
  #   paths: [".github/**", "ui-desktop/**", "ui-core/**", "proxy-router/**", "cli/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TEST_ENV_VAR: "test"

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    if: |
      github.repository == 'MorpheusAIs/Morpheus-Lumerin-Node' &&
      (
        (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/cicd/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test' || github.ref == 'refs/heads/dev')) ||
        (github.event_name == 'workflow_dispatch')
      )
    outputs:
      proxy: ${{ steps.classify.outputs.proxy }}
      ui: ${{ steps.classify.outputs.ui }}
      cicd: ${{ steps.classify.outputs.cicd }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          emit() {
            echo "proxy=$1" >> "$GITHUB_OUTPUT"
            echo "ui=$2"     >> "$GITHUB_OUTPUT"
            echo "cicd=$3"   >> "$GITHUB_OUTPUT"
            {
              echo "### 🔎 Component change detection"
              echo ""
              echo "| Component | Changed |"
              echo "|-----------|---------|"
              echo "| proxy-router | \`$1\` |"
              echo "| ui-desktop / cli | \`$2\` |"
              echo "| ci-cd (.github) | \`$3\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Manual dispatch = operator-driven full build. The build_all_os /
          # create_deployment inputs remain the single source of truth for what
          # actually runs, so classify every component as changed here.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch → all components treated as changed."
            emit true true true
            exit 0
          fi

          # New branch / first push / force-push with no usable base → fail safe
          # to a full build (and a minor version bump).
          if [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base commit ('${BEFORE_SHA:-}') → all components treated as changed."
            emit true true true
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          echo "Changed files ($BEFORE_SHA..$AFTER_SHA):"
          echo "$CHANGED" | sed 's/^/  /'

          PROXY=false
          UI=false
          CICD=false
          # proxy-router (anchor component). Per design, swagger/docs under
          # proxy-router/ intentionally count as a proxy change.
          if echo "$CHANGED" | grep -Eq '^proxy-router/'; then PROXY=true; fi
          # UI components eligible for an independent patch release.
          if echo "$CHANGED" | grep -Eq '^(ui-desktop|cli)/'; then UI=true; fi
          # CI/CD changes (excluding the docs workflow, which docs.yml owns).
          if echo "$CHANGED" | grep -E '^\.github/' | grep -qv '^\.github/workflows/docs\.yml$'; then CICD=true; fi

          emit "$PROXY" "$UI" "$CICD"

  Go-Module-Verify:
    name: Verify Go Modules
    if: |
      github.repository == 'MorpheusAIs/Morpheus-Lumerin-Node' &&
      (
        (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/cicd/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test' || github.ref == 'refs/heads/dev')) ||
        (github.event_name == 'workflow_dispatch') 
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            proxy-router/go.sum
            cli/go.sum

      - name: Verify proxy-router go.mod/go.sum are in sync
        working-directory: proxy-router
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo ""
            echo "❌ proxy-router/go.mod or go.sum is out of date!"
            echo "Run 'cd proxy-router && go mod tidy' locally and commit the changes."
            exit 1
          fi
          echo "✅ proxy-router go.mod/go.sum are in sync"

      - name: Verify cli go.mod/go.sum are in sync
        working-directory: cli
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo ""
            echo "❌ cli/go.mod or go.sum is out of date!"
            echo "Run 'cd cli && go mod tidy' locally and commit the changes."
            exit 1
          fi
          echo "✅ cli go.mod/go.sum are in sync"

  Generate-Tag:
    runs-on: ubuntu-latest
    name: Generate Tag Name
    needs:
      - changes
    if: |
      github.repository == 'MorpheusAIs/Morpheus-Lumerin-Node' &&
      (
        (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/cicd/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test' || github.ref == 'refs/heads/dev')) ||
        (github.event_name == 'workflow_dispatch') 
      )
    outputs:
      tag_name: ${{ steps.gen_tag_name.outputs.tag_name }}
      vtag: ${{ steps.gen_tag_name.outputs.vtag }}
      vfull: ${{ steps.gen_tag_name.outputs.vfull }}
      image_name: ${{ steps.gen_tag_name.outputs.image_name }}
      tee_image_name: ${{ steps.gen_tag_name.outputs.tee_image_name }}
      artifacts_base_url: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.gen_tag_name.outputs.tag_name }}
      # Proxy-router "anchor" the desktop app downloads its bundled router from.
      # On main this is always vX.Y.0 (the minor's proxy baseline). On test,
      # full (proxy-changed) builds self-anchor; UI-only builds reuse the last
      # known good -test release that published router binaries.
      anchor_vfull: ${{ steps.gen_tag_name.outputs.anchor_vfull }}
      anchor_tag: ${{ steps.gen_tag_name.outputs.anchor_tag }}
      anchor_artifacts_base_url: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.gen_tag_name.outputs.anchor_tag }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine tag name
        id: gen_tag_name
        shell: bash
        env:
          PROXY_CHANGED: ${{ needs.changes.outputs.proxy }}
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE_NAME="ghcr.io/morpheusais/morpheus-lumerin-node"
          VMAJ_NEW=7
          VMIN_NEW=0
          VPAT_NEW=0
          set +o pipefail

          # Find the last production tag (clean semver only, no -test/-dev suffix).
          # Uses git tag -l + version sort instead of git describe, which can
          # pick a wrong tag when multiple tags (e.g. v6.0.0 and v5.14.30-test)
          # sit on the same commit.
          VLAST=$(git tag -l "v[0-9]*" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1 | cut -c2-)

          if [ -n "$VLAST" ]; then
              eval $(echo "$VLAST" | awk -F '.' '{print "VMAJ="$1" VMIN="$2" VPAT="$3}')
          else
              VMAJ=0
              VMIN=0
              VPAT=0
          fi

          if [ "$GITHUB_REF_NAME" = "main" ]; then
              if [ "$VMAJ_NEW" -gt "$VMAJ" ]; then
                  # Forced major floor (e.g. first v7 release).
                  VMAJ=$VMAJ_NEW
                  VMIN=$VMIN_NEW
                  VPAT=$VPAT_NEW
                  BUMP="major-floor"
              elif [ "${PROXY_CHANGED}" = "true" ]; then
                  # proxy-router changed → MINOR bump, re-anchor (patch resets to 0).
                  VMIN=$((VMIN+1))
                  VPAT=0
                  BUMP="minor (proxy-router changed)"
              else
                  # UI/CLI-only change → PATCH bump on top of the current proxy anchor.
                  VPAT=$((VPAT+1))
                  BUMP="patch (UI-only, proxy unchanged)"
              fi
              VFULL=${VMAJ}.${VMIN}.${VPAT}
              VTAG=v$VFULL
              # On main the desktop app always bundles the minor's proxy baseline
              # (vX.Y.0). For a minor build this equals self; for a patch build it
              # points back at the already-published proxy release.
              ANCHOR_VFULL=${VMAJ}.${VMIN}.0
              ANCHOR_TAG=v${ANCHOR_VFULL}
          else
              if [ "$VMAJ_NEW" -gt "$VMAJ" ]; then
                  VMAJ=$VMAJ_NEW
                  VMIN=$VMIN_NEW
              fi
              MB=$(git merge-base refs/remotes/origin/main HEAD)
              VPAT=$(git rev-list --count --no-merges ${MB}..HEAD)
              VFULL=${VMAJ}.${VMIN}.${VPAT}
              RNAME=${GITHUB_REF_NAME##*/}
              [ "$GITHUB_EVENT_NAME" = "pull_request" ] && RNAME=pr${GITHUB_REF_NAME%/merge}
              VTAG=v${VFULL}-${RNAME}
              BUMP="prerelease"
              if [ "${PROXY_CHANGED}" = "true" ] || [ "$GITHUB_REF_NAME" != "test" ]; then
                  # Full prerelease / non-test branches build their own router
                  # executables and self-anchor.
                  ANCHOR_VFULL=${VFULL}
                  ANCHOR_TAG=${VTAG}
              else
                  # UI-only on test: same idea as main's vX.Y.0 — do not rebuild
                  # router/docker/TEE; point the desktop app at the last known
                  # good -test release that published router binaries.
                  ANCHOR_TAG=""
                  while read -r cand; do
                      has_router=$(gh release view "$cand" --json assets \
                        --jq '[.assets[].name | select(contains("morpheus-router"))] | length' 2>/dev/null || echo 0)
                      if [ "${has_router:-0}" -gt 0 ]; then
                          ANCHOR_TAG=$cand
                          break
                      fi
                  done < <(git tag -l "v[0-9]*-test" | sort -V -r)

                  if [ -z "$ANCHOR_TAG" ]; then
                      echo "❌ UI-only test release needs a last-known-good -test release with router binaries" >&2
                      exit 1
                  fi
                  ANCHOR_VFULL=$(echo "$ANCHOR_TAG" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
                  BUMP="prerelease (UI-only, proxy anchored to ${ANCHOR_TAG})"
              fi
          fi

          # Output variables for use in subsequent jobs environment
          echo "tag_name=${VTAG}" >> $GITHUB_OUTPUT
          echo "vtag=${VTAG}" >> $GITHUB_OUTPUT
          echo "vfull=${VFULL}" >> $GITHUB_OUTPUT
          echo "anchor_vfull=${ANCHOR_VFULL}" >> $GITHUB_OUTPUT
          echo "anchor_tag=${ANCHOR_TAG}" >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "tee_image_name=${IMAGE_NAME}-tee" >> $GITHUB_OUTPUT
          echo "✅ New Build Tag: $VTAG ($BUMP)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Proxy Anchor: $ANCHOR_TAG" >> $GITHUB_STEP_SUMMARY
          echo "✅ Docker Image: ${IMAGE_NAME}:${VTAG}" >> $GITHUB_STEP_SUMMARY
          echo "✅ TEE Image: ${IMAGE_NAME}-tee:${VTAG}" >> $GITHUB_STEP_SUMMARY
          echo "❌ Old Major Tag: $VLAST"  >> $GITHUB_STEP_SUMMARY

  Build-Proxy-Router-Test:
    name: Test Proxy Router Docker Image
    if: |
      github.repository == 'MorpheusAIs/Morpheus-Lumerin-Node' &&
      !(github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test') && needs.changes.outputs.proxy != 'true') &&
      (
        (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/cicd/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test' || github.ref == 'refs/heads/dev')) ||
        (github.event_name == 'workflow_dispatch') 
      )
    runs-on: ubuntu-latest
    needs:
      - changes
      - Generate-Tag
      - Go-Module-Verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image to Test
        run: |
          BUILDTAG=${{ needs.Generate-Tag.outputs.tag_name }}
          BUILDIMAGE=${{ needs.Generate-Tag.outputs.image_name }}
          BUILDCOMMIT=${{ github.sha }}
          docker buildx build \
            --platform linux/amd64 \
            --build-arg TAG_NAME=$BUILDTAG \
            --build-arg COMMIT=$BUILDCOMMIT \
            --cache-from type=gha \
            --cache-to type=gha,mode=min \
            --load \
            -t $BUILDIMAGE:$BUILDTAG \
            -f proxy-router/Dockerfile \
            proxy-router || (echo "❌ Failed to build image with tag: $BUILDIMAGE:$BUILDTAG" && exit 1)
          echo "✅ Proxy-Router Test Build Successful!"

      - name: Run Docker Tests
        uses: ./.github/actions/docker_test
        with:
          image: "${{ needs.Generate-Tag.outputs.image_name }}:${{ needs.Generate-Tag.outputs.tag_name }}"
          private_key: ${{ secrets.TEST_PRIVATE_KEY }}

  GHCR-Build-and-Push:
    name: Build & Push Docker Image
    if: |
      github.repository == 'MorpheusAIs/Morpheus-Lumerin-Node' &&
      !(github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test') && needs.changes.outputs.proxy != 'true') &&
      (
        (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/cicd/')|| github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.build_all_os == 'true') 
      )
    needs:
      - changes
      - Generate-Tag
      - Build-Proxy-Router-Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.capture-digest.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Platform Docker Image
        run: |
          BUILDTAG=${{ needs.Generate-Tag.outputs.tag_name }}
          BUILDIMAGE=${{ needs.Generate-Tag.outputs.image_name }}
          BUILDCOMMIT=${{ github.sha }}
          
          # Build multi-platform for main and test branches to support all architectures:
          # - linux/amd64: Linux x64 servers, Mac Intel (via Docker VM)
          # - linux/arm64: Raspberry Pi, AWS Graviton, Mac Apple Silicon (via Docker VM)
          # Feature branches stay single-platform for faster iteration
          if [[ "${{ github.ref_name }}" == feat/* ]]; then
            PLATFORMS="linux/amd64"
            echo "🚀 Building single platform (amd64) for faster feature branch builds"
          else
            PLATFORMS="linux/amd64,linux/arm64"
            echo "🚀 Building multi-platform container image for: $PLATFORMS"
          fi
          
          docker buildx build \
            --platform $PLATFORMS \
            --build-arg TAG_NAME=$BUILDTAG \
            --build-arg COMMIT=$BUILDCOMMIT \
            --cache-from type=gha \
            --cache-to type=gha,mode=min \
            --metadata-file /tmp/build-metadata.json \
            --push \
            -t $BUILDIMAGE:$BUILDTAG \
            -f proxy-router/Dockerfile \
            proxy-router || (echo "❌ Failed to push image with tag: $BUILDIMAGE:$BUILDTAG" && exit 1)
          echo "✅ Proxy-Router Build and Push of $BUILDIMAGE:$BUILDTAG Successful!"

      - name: Capture image digest
        id: capture-digest
        run: |
          DIGEST=$(jq -r '.["containerimage.digest"]' /tmp/build-metadata.json)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "📋 Image digest: \`$DIGEST\`" >> $GITHUB_STEP_SUMMARY

      - name: Sign image with cosign (keyless)
        run: |
          BUILDIMAGE=${{ needs.Generate-Tag.outputs.image_name }}
          DIGEST=${{ steps.capture-digest.outputs.digest }}
          cosign sign --yes "$BUILDIMAGE@$DIGEST"
          echo "🔏 Image signed: \`$BUILDIMAGE@$DIGEST\`" >> $GITHUB_STEP_SUMMARY

      - name: Push Latest Tags
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test' }}
        run: |
          BUILDIMAGE=${{ needs.Generate-Tag.outputs.image_name }}
          BUILDTAG=${{ needs.Generate-Tag.outputs.tag_name }}
          
          # Use imagetools to create latest tags as aliases to the multi-arch manifest
          # This preserves all architectures (unlike docker pull/tag/push which only gets the runner's arch)
          if [ "${{ github.ref_name }}" == "main" ]; then
            LATEST_TAG="latest"
          else
            LATEST_TAG="latest-test"
          fi
          
          docker buildx imagetools create -t $BUILDIMAGE:$LATEST_TAG $BUILDIMAGE:$BUILDTAG || (echo "❌ Failed to create :$LATEST_TAG tag" && exit 1)
          echo "✅ Proxy-Router Push $BUILDIMAGE:$LATEST_TAG Tag Successful!"

  GHCR-Build-and-Push-TEE:
    name: Build & Push TEE Docker Image
    if: |
      github.repository == 'MorpheusAIs/Morpheus-Lumerin-Node' &&
      !(github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test') && needs.changes.outputs.proxy != 'true') &&
      (
        (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/cicd/')|| github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.build_all_os == 'true') 
      )
    needs:
      - changes
      - Generate-Tag
      - GHCR-Build-and-Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.capture-digest.outputs.digest }}
      rtmr3: ${{ steps.compute-rtmr3.outputs.rtmr3 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Load network configuration
        id: network-config
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            ENV_FILE=".github/workflows/main.env"
            NETWORK="mainnet"
          else
            ENV_FILE=".github/workflows/test.env"
            NETWORK="testnet"
          fi

          DIAMOND_ADDRESS=$(grep '^DIAMOND_ADDRESS=' "$ENV_FILE" | cut -d= -f2-)
          TOKEN_ADDRESS=$(grep '^TOKEN_ADDRESS=' "$ENV_FILE" | cut -d= -f2-)
          BLOCKSCOUT_API_URL=$(grep '^BLOCKSCOUT_API_URL=' "$ENV_FILE" | cut -d= -f2-)
          CHAIN_ID=$(grep '^CHAIN_ID=' "$ENV_FILE" | cut -d= -f2-)

          echo "diamond_contract_address=$DIAMOND_ADDRESS" >> $GITHUB_OUTPUT
          echo "mor_token_address=$TOKEN_ADDRESS" >> $GITHUB_OUTPUT
          echo "blockscout_api_url=$BLOCKSCOUT_API_URL" >> $GITHUB_OUTPUT
          echo "eth_node_chain_id=$CHAIN_ID" >> $GITHUB_OUTPUT
          echo "network=$NETWORK" >> $GITHUB_OUTPUT

          echo "🔗 Network: **$NETWORK** (from $ENV_FILE)" >> $GITHUB_STEP_SUMMARY
          echo "   Chain ID: $CHAIN_ID" >> $GITHUB_STEP_SUMMARY
          echo "   Diamond: $DIAMOND_ADDRESS" >> $GITHUB_STEP_SUMMARY
          echo "   Token: $TOKEN_ADDRESS" >> $GITHUB_STEP_SUMMARY
          echo "   Blockscout: $BLOCKSCOUT_API_URL" >> $GITHUB_STEP_SUMMARY

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push TEE Docker Image
        run: |
          BUILDTAG=${{ needs.Generate-Tag.outputs.tag_name }}
          BASE_IMAGE=${{ needs.Generate-Tag.outputs.image_name }}:$BUILDTAG
          TEE_IMAGE="${{ needs.Generate-Tag.outputs.image_name }}-tee"
          
          echo "🔒 Building TEE-hardened image (${{ steps.network-config.outputs.network }}) from base: $BASE_IMAGE"
          
          # TEE image is amd64-only (Intel TDX and AMD SEV are both x86_64)
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE=$BASE_IMAGE \
            --build-arg DIAMOND_CONTRACT_ADDRESS=${{ steps.network-config.outputs.diamond_contract_address }} \
            --build-arg MOR_TOKEN_ADDRESS=${{ steps.network-config.outputs.mor_token_address }} \
            --build-arg BLOCKSCOUT_API_URL=${{ steps.network-config.outputs.blockscout_api_url }} \
            --build-arg ETH_NODE_CHAIN_ID=${{ steps.network-config.outputs.eth_node_chain_id }} \
            --metadata-file /tmp/tee-build-metadata.json \
            --push \
            -t $TEE_IMAGE:$BUILDTAG \
            -f proxy-router/Dockerfile.tee \
            proxy-router || (echo "❌ Failed to push TEE image" && exit 1)
          echo "✅ TEE Image pushed: $TEE_IMAGE:$BUILDTAG"

      - name: Capture TEE image digest
        id: capture-digest
        run: |
          DIGEST=$(jq -r '.["containerimage.digest"]' /tmp/tee-build-metadata.json)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "📋 TEE image digest: \`$DIGEST\`" >> $GITHUB_STEP_SUMMARY

      - name: Sign TEE image with cosign (keyless)
        run: |
          TEE_IMAGE="${{ needs.Generate-Tag.outputs.image_name }}-tee"
          DIGEST=${{ steps.capture-digest.outputs.digest }}
          cosign sign --yes "$TEE_IMAGE@$DIGEST"
          echo "🔏 TEE image signed: \`$TEE_IMAGE@$DIGEST\`" >> $GITHUB_STEP_SUMMARY

      - name: Load SecretVM artifact config
        id: secretvm-config
        run: |
          source .github/tee/secretvm.env
          echo "release=$SECRETVM_RELEASE" >> $GITHUB_OUTPUT
          echo "rootfs_variant=$SECRETVM_ROOTFS_VARIANT" >> $GITHUB_OUTPUT
          echo "rootfs_tdx_url=$SECRETVM_ROOTFS_TDX_URL" >> $GITHUB_OUTPUT
          echo "rootfs_tdx_sha256=$SECRETVM_ROOTFS_TDX_SHA256" >> $GITHUB_OUTPUT
          echo "rootfs_sev_url=${SECRETVM_ROOTFS_SEV_URL:-}" >> $GITHUB_OUTPUT
          echo "rootfs_sev_sha256=${SECRETVM_ROOTFS_SEV_SHA256:-}" >> $GITHUB_OUTPUT
          echo "tdx_registry_url=${SECRETVM_TDX_REGISTRY_URL:-https://cdn.jsdelivr.net/npm/secretvm-verify@0.13.0/data/tdx.csv}" >> $GITHUB_OUTPUT
          echo "sev_registry_url=${SECRETVM_SEV_REGISTRY_URL:-https://cdn.jsdelivr.net/npm/secretvm-verify@0.13.0/data/sev.json}" >> $GITHUB_OUTPUT
          echo "sev_registry_vm_type=${SECRETVM_SEV_REGISTRY_VM_TYPE:-prod}" >> $GITHUB_OUTPUT
          echo "verify_npm_version=${SECRETVM_VERIFY_NPM_VERSION:-0.13.0}" >> $GITHUB_OUTPUT

          # legacy aliases retained so older steps continue to compile
          echo "rootfs_url=$SECRETVM_ROOTFS_TDX_URL" >> $GITHUB_OUTPUT
          echo "rootfs_sha256=$SECRETVM_ROOTFS_TDX_SHA256" >> $GITHUB_OUTPUT

      - name: Cache SecretVM artifacts
        id: cache-rootfs
        uses: actions/cache@v5
        with:
          path: /tmp/secretvm-artifacts
          key: secretvm-${{ steps.secretvm-config.outputs.release }}-${{ steps.secretvm-config.outputs.rootfs_variant }}-reg-${{ steps.secretvm-config.outputs.verify_npm_version }}

      - name: Fetch SecretVM registries + optional rootfs
        id: secretvm-artifacts
        run: |
          mkdir -p /tmp/secretvm-artifacts
          set -euo pipefail

          TDX_REG_URL="${{ steps.secretvm-config.outputs.tdx_registry_url }}"
          SEV_REG_URL="${{ steps.secretvm-config.outputs.sev_registry_url }}"
          TDX_REG_FILE="/tmp/secretvm-artifacts/tdx.csv"
          SEV_REG_FILE="/tmp/secretvm-artifacts/sev.json"

          echo "⬇️  Fetching TDX registry from $TDX_REG_URL..."
          curl -fsSL --retry 3 --retry-delay 5 -o "$TDX_REG_FILE" "$TDX_REG_URL"
          echo "⬇️  Fetching SEV registry from $SEV_REG_URL..."
          curl -fsSL --retry 3 --retry-delay 5 -o "$SEV_REG_FILE" "$SEV_REG_URL"

          TDX_EXPECTED_SHA="${{ steps.secretvm-config.outputs.rootfs_tdx_sha256 }}"
          SEV_EXPECTED_SHA="${{ steps.secretvm-config.outputs.rootfs_sev_sha256 }}"
          RELEASE="${{ steps.secretvm-config.outputs.release }}"
          export TDX_EXPECTED_SHA SEV_EXPECTED_SHA RELEASE

          # Cross-check pins against secretvm-verify registries (npm/PyPI data/).
          python3 - <<'PY'
          import csv, json, os, sys
          tdx_pin = os.environ["TDX_EXPECTED_SHA"].lower().removeprefix("0x")
          sev_pin = os.environ["SEV_EXPECTED_SHA"].lower().removeprefix("0x")
          release = os.environ["RELEASE"]
          with open("/tmp/secretvm-artifacts/tdx.csv", newline="") as f:
              rows = list(csv.DictReader(f))
          tdx_ok = any(
              r.get("artifacts_ver") == release
              and r.get("vm_type") == "prod"
              and (r.get("rootfs_data") or "").lower().removeprefix("0x") == tdx_pin
              for r in rows
          )
          if not tdx_ok:
              print(f"ERROR: TDX pin {tdx_pin} not found in tdx.csv for prod/{release}", file=sys.stderr)
              sys.exit(1)
          sev = json.load(open("/tmp/secretvm-artifacts/sev.json"))
          sev_ok = any(
              e.get("artifacts_ver") == release
              and e.get("vm_type") == "prod"
              and (e.get("rootfs_hash") or "").lower().removeprefix("0x") == sev_pin
              for e in sev
          )
          if not sev_ok:
              print(f"ERROR: SEV pin {sev_pin} not found in sev.json for prod/{release}", file=sys.stderr)
              sys.exit(1)
          print(f"✅ Pins match secretvm-verify registries for prod/{release}")
          PY

          # Optional ISO download (legacy GitHub releases). Prefer pin when 404.
          TDX_FILE="/tmp/secretvm-artifacts/${{ steps.secretvm-config.outputs.rootfs_variant }}-tdx.iso"
          ROOTFS_MODE="pin"
          if curl -fsSL --retry 2 --retry-delay 3 -o "$TDX_FILE" \
              "${{ steps.secretvm-config.outputs.rootfs_tdx_url }}"; then
            ACTUAL=$(sha256sum "$TDX_FILE" | cut -d' ' -f1)
            if [ "$ACTUAL" = "$TDX_EXPECTED_SHA" ]; then
              ROOTFS_MODE="iso"
              echo "✅ TDX rootfs ISO downloaded and matches pin" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️  TDX ISO sha mismatch (got $ACTUAL); using pin for RTMR3" >> $GITHUB_STEP_SUMMARY
              rm -f "$TDX_FILE"
            fi
          else
            echo "ℹ️  TDX rootfs ISO unavailable; using pinned SHA for RTMR3" >> $GITHUB_STEP_SUMMARY
            rm -f "$TDX_FILE"
          fi

          SEV_REG_SHA=$(sha256sum "$SEV_REG_FILE" | cut -d' ' -f1)
          TDX_REG_SHA=$(sha256sum "$TDX_REG_FILE" | cut -d' ' -f1)
          echo "rootfs_mode=$ROOTFS_MODE" >> $GITHUB_OUTPUT
          echo "sev_registry_path=$SEV_REG_FILE" >> $GITHUB_OUTPUT
          echo "tdx_registry_path=$TDX_REG_FILE" >> $GITHUB_OUTPUT
          echo "sev_registry_sha256=$SEV_REG_SHA" >> $GITHUB_OUTPUT
          echo "tdx_registry_sha256=$TDX_REG_SHA" >> $GITHUB_OUTPUT
          echo "📋 secretvm-verify@${{ steps.secretvm-config.outputs.verify_npm_version }} registries fetched" >> $GITHUB_STEP_SUMMARY
          echo "   TDX: \`$TDX_REG_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "   SEV: \`$SEV_REG_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "   TDX rootfs sha256 (pin): \`$TDX_EXPECTED_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "   SEV rootfs sha256 (pin): \`$SEV_EXPECTED_SHA\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate deployed compose with immutable digest
        id: generate-compose
        run: |
          TEE_IMAGE="${{ needs.Generate-Tag.outputs.image_name }}-tee"
          DIGEST=${{ steps.capture-digest.outputs.digest }}
          
          sed "s|image: ghcr.io/morpheusais/morpheus-lumerin-node-tee:.*|image: ${TEE_IMAGE}@${DIGEST}|" \
            proxy-router/docker-compose.tee.yml > /tmp/docker-compose.tee.deployed.yml
          
          COMPOSE_BYTES=$(wc -c < /tmp/docker-compose.tee.deployed.yml | tr -d ' ')
          COMPOSE_SHA=$(sha256sum /tmp/docker-compose.tee.deployed.yml | cut -d' ' -f1)
          echo "compose_sha256=$COMPOSE_SHA" >> $GITHUB_OUTPUT
          
          echo "📋 Generated deployed compose (digest-pinned):" >> $GITHUB_STEP_SUMMARY
          echo "   SHA-256: \`$COMPOSE_SHA\`  (${COMPOSE_BYTES} bytes)" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          cat /tmp/docker-compose.tee.deployed.yml >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Compute RTMR3 (Intel TDX)
        id: compute-rtmr3
        run: |
          TDX_PIN="${{ steps.secretvm-config.outputs.rootfs_tdx_sha256 }}"
          ROOTFS_FILE="/tmp/secretvm-artifacts/${{ steps.secretvm-config.outputs.rootfs_variant }}-tdx.iso"
          if [ -f "$ROOTFS_FILE" ]; then
            RTMR3=$(python3 proxy-router/scripts/compute-rtmr3.py \
              /tmp/docker-compose.tee.deployed.yml \
              "$ROOTFS_FILE" \
              --json)
          else
            RTMR3=$(python3 proxy-router/scripts/compute-rtmr3.py \
              /tmp/docker-compose.tee.deployed.yml \
              --rootfs-sha256="$TDX_PIN" \
              --json)
          fi

          RTMR3_HEX=$(echo "$RTMR3" | python3 -c "import sys,json; print(json.load(sys.stdin)['rtmr3'])")
          COMPOSE_HASH=$(echo "$RTMR3" | python3 -c "import sys,json; print(json.load(sys.stdin)['compose_sha256'])")
          ROOTFS_HASH=$(echo "$RTMR3" | python3 -c "import sys,json; print(json.load(sys.stdin)['rootfs_sha256'])")

          echo "rtmr3=$RTMR3_HEX" >> $GITHUB_OUTPUT
          echo "🔐 Expected RTMR3: \`$RTMR3_HEX\`" >> $GITHUB_STEP_SUMMARY
          echo "   compose sha256: \`$COMPOSE_HASH\`" >> $GITHUB_STEP_SUMMARY
          echo "   rootfs sha256:  \`$ROOTFS_HASH\`" >> $GITHUB_STEP_SUMMARY

      - name: Compute SEV-SNP measurement (per template)
        id: compute-sev
        if: steps.secretvm-config.outputs.sev_registry_url != ''
        run: |
          SEV_OUT=$(python3 proxy-router/scripts/compute-sev-measurement.py \
            --registry "${{ steps.secretvm-artifacts.outputs.sev_registry_path }}" \
            --vm-type "${{ steps.secretvm-config.outputs.sev_registry_vm_type }}" \
            --artifacts-ver "${{ steps.secretvm-config.outputs.release }}" \
            --compose /tmp/docker-compose.tee.deployed.yml \
            --all-templates --json)

          # Persist the full JSON to a file so the manifest step can pull individual fields.
          echo "$SEV_OUT" > /tmp/sev-measurements.json

          SMALL=$(  echo "$SEV_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['per_template']['small'])")
          MEDIUM=$( echo "$SEV_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['per_template']['medium'])")
          LARGE=$(  echo "$SEV_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['per_template']['large'])")
          XL2=$(    echo "$SEV_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['per_template']['2xlarge'])")
          XL4=$(    echo "$SEV_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['per_template']['4xlarge'])")

          echo "sev_measurement_small=$SMALL"     >> $GITHUB_OUTPUT
          echo "sev_measurement_medium=$MEDIUM"   >> $GITHUB_OUTPUT
          echo "sev_measurement_large=$LARGE"     >> $GITHUB_OUTPUT
          echo "sev_measurement_2xlarge=$XL2"     >> $GITHUB_OUTPUT
          echo "sev_measurement_4xlarge=$XL4"     >> $GITHUB_OUTPUT

          KERNEL_HASH=$(echo "$SEV_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['kernel_hash'])")
          INITRD_HASH=$(echo "$SEV_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['initrd_hash'])")
          OVMF_HASH=$(  echo "$SEV_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['ovmf_hash'])")
          ROOTFS_SHA=$( echo "$SEV_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['rootfs_hash'])")
          CMDLINE=$(    echo "$SEV_OUT" | python3 -c "import sys,json; print(json.load(sys.stdin)['kernel_cmdline'])")

          echo "sev_kernel_hash=$KERNEL_HASH"     >> $GITHUB_OUTPUT
          echo "sev_initrd_hash=$INITRD_HASH"     >> $GITHUB_OUTPUT
          echo "sev_ovmf_hash=$OVMF_HASH"         >> $GITHUB_OUTPUT
          echo "sev_rootfs_sha256=$ROOTFS_SHA"    >> $GITHUB_OUTPUT
          echo "sev_kernel_cmdline=$CMDLINE"      >> $GITHUB_OUTPUT

          echo "🔐 Expected SEV-SNP measurement (per template):" >> $GITHUB_STEP_SUMMARY
          echo "   small   (1 vCPU):  \`$SMALL\`" >> $GITHUB_STEP_SUMMARY
          echo "   medium  (2 vCPU):  \`$MEDIUM\`" >> $GITHUB_STEP_SUMMARY
          echo "   large   (4 vCPU):  \`$LARGE\`" >> $GITHUB_STEP_SUMMARY
          echo "   2xlarge (8 vCPU):  \`$XL2\`" >> $GITHUB_STEP_SUMMARY
          echo "   4xlarge (16 vCPU): \`$XL4\`" >> $GITHUB_STEP_SUMMARY
          echo "   kernel sha256:  \`$KERNEL_HASH\`" >> $GITHUB_STEP_SUMMARY
          echo "   initrd sha256:  \`$INITRD_HASH\`" >> $GITHUB_STEP_SUMMARY
          echo "   ovmf sha384:    \`$OVMF_HASH\`" >> $GITHUB_STEP_SUMMARY
          echo "   rootfs sha256:  \`$ROOTFS_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "   cmdline:        \`$CMDLINE\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate and attach SBOM
        run: |
          TEE_IMAGE="${{ needs.Generate-Tag.outputs.image_name }}-tee"
          DIGEST=${{ steps.capture-digest.outputs.digest }}
          
          syft "$TEE_IMAGE@$DIGEST" -o spdx-json=sbom-tee.spdx.json
          cosign attach sbom --sbom sbom-tee.spdx.json "$TEE_IMAGE@$DIGEST"
          echo "📦 SBOM generated and attached to TEE image" >> $GITHUB_STEP_SUMMARY

      - name: Extract baked log levels from Dockerfile.tee
        id: baked-loglevels
        run: |
          # Pin the manifest's baked_env LOG_LEVEL_* fields to whatever Dockerfile.tee bakes in.
          # This guarantees the published attestation reflects the *actual* image contents and
          # demonstrates that we are not running with debug-level logging in production
          # (privacy concern: debug-level app logs could expose request/prompt payloads).
          DF=proxy-router/Dockerfile.tee
          extract() {
            grep -E "^ENV $1=" "$DF" | head -n1 | sed -E "s/^ENV $1=//; s/[[:space:]]+$//"
          }
          LOG_LEVEL_APP=$(extract LOG_LEVEL_APP)
          LOG_LEVEL_TCP=$(extract LOG_LEVEL_TCP)
          LOG_LEVEL_ETH_RPC=$(extract LOG_LEVEL_ETH_RPC)
          LOG_LEVEL_STORAGE=$(extract LOG_LEVEL_STORAGE)
          LOG_COLOR=$(extract LOG_COLOR)
          LOG_JSON=$(extract LOG_JSON)
          LOG_IS_PROD=$(extract LOG_IS_PROD)

          # Hard fail if the privacy-critical ones are missing or set to debug.
          for var in LOG_LEVEL_APP LOG_LEVEL_TCP LOG_LEVEL_ETH_RPC LOG_LEVEL_STORAGE; do
            val=$(eval echo \${$var})
            if [ -z "$val" ]; then
              echo "❌ $var is not baked in Dockerfile.tee — refusing to publish manifest" >&2
              exit 1
            fi
            if [ "$val" = "debug" ] && [ "$var" = "LOG_LEVEL_APP" ]; then
              echo "❌ LOG_LEVEL_APP=debug in Dockerfile.tee — privacy violation, refusing to publish manifest" >&2
              exit 1
            fi
          done

          echo "log_level_app=$LOG_LEVEL_APP"           >> $GITHUB_OUTPUT
          echo "log_level_tcp=$LOG_LEVEL_TCP"           >> $GITHUB_OUTPUT
          echo "log_level_eth_rpc=$LOG_LEVEL_ETH_RPC"   >> $GITHUB_OUTPUT
          echo "log_level_storage=$LOG_LEVEL_STORAGE"   >> $GITHUB_OUTPUT
          echo "log_color=$LOG_COLOR"                   >> $GITHUB_OUTPUT
          echo "log_json=$LOG_JSON"                     >> $GITHUB_OUTPUT
          echo "log_is_prod=$LOG_IS_PROD"               >> $GITHUB_OUTPUT

          echo "📝 Baked log levels:" >> $GITHUB_STEP_SUMMARY
          echo "   LOG_LEVEL_APP=$LOG_LEVEL_APP, LOG_LEVEL_TCP=$LOG_LEVEL_TCP, LOG_LEVEL_ETH_RPC=$LOG_LEVEL_ETH_RPC, LOG_LEVEL_STORAGE=$LOG_LEVEL_STORAGE" >> $GITHUB_STEP_SUMMARY
          echo "   LOG_COLOR=$LOG_COLOR, LOG_JSON=$LOG_JSON, LOG_IS_PROD=$LOG_IS_PROD" >> $GITHUB_STEP_SUMMARY

      - name: Generate TEE attestation manifest
        run: |
          TEE_IMAGE="${{ needs.Generate-Tag.outputs.image_name }}-tee"
          TEE_DIGEST=${{ steps.capture-digest.outputs.digest }}
          BASE_IMAGE=${{ needs.Generate-Tag.outputs.image_name }}
          BASE_DIGEST=${{ needs.GHCR-Build-and-Push.outputs.digest }}
          BUILDTAG=${{ needs.Generate-Tag.outputs.tag_name }}
          RTMR3=${{ steps.compute-rtmr3.outputs.rtmr3 }}
          SECRETVM_RELEASE=${{ steps.secretvm-config.outputs.release }}
          ROOTFS_VARIANT=${{ steps.secretvm-config.outputs.rootfs_variant }}
          ROOTFS_TDX_SHA256=${{ steps.secretvm-config.outputs.rootfs_tdx_sha256 }}
          ROOTFS_SEV_SHA256=${{ steps.secretvm-config.outputs.rootfs_sev_sha256 }}

          COMPOSE_SHA="sha256:$(sha256sum /tmp/docker-compose.tee.deployed.yml | cut -d' ' -f1)"
          DOCKERFILE_SHA="sha256:$(sha256sum proxy-router/Dockerfile.tee | cut -d' ' -f1)"
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # SEV section is conditional on having computed measurements.
          # Build it as standalone JSON first, then inject via --argjson into the main manifest.
          if [ -n "${{ steps.compute-sev.outputs.sev_measurement_small }}" ]; then
            SEV_BLOCK_JSON=$(jq -n \
              --arg vm_type "${{ steps.secretvm-config.outputs.sev_registry_vm_type }}" \
              --arg secretvm_release "$SECRETVM_RELEASE" \
              --arg rootfs "$ROOTFS_SEV_SHA256" \
              --arg kernel "${{ steps.compute-sev.outputs.sev_kernel_hash }}" \
              --arg initrd "${{ steps.compute-sev.outputs.sev_initrd_hash }}" \
              --arg ovmf "${{ steps.compute-sev.outputs.sev_ovmf_hash }}" \
              --arg cmdline "${{ steps.compute-sev.outputs.sev_kernel_cmdline }}" \
              --arg registry_url "${{ steps.secretvm-config.outputs.sev_registry_url }}" \
              --arg registry_sha "${{ steps.secretvm-artifacts.outputs.sev_registry_sha256 }}" \
              --arg small   "${{ steps.compute-sev.outputs.sev_measurement_small }}" \
              --arg medium  "${{ steps.compute-sev.outputs.sev_measurement_medium }}" \
              --arg large   "${{ steps.compute-sev.outputs.sev_measurement_large }}" \
              --arg xl2     "${{ steps.compute-sev.outputs.sev_measurement_2xlarge }}" \
              --arg xl4     "${{ steps.compute-sev.outputs.sev_measurement_4xlarge }}" \
              '{
                vcpu_type: "EPYC",
                vm_type: $vm_type,
                secretvm_release: $secretvm_release,
                rootfs_sha256: $rootfs,
                kernel_hash: $kernel,
                initrd_hash: $initrd,
                ovmf_hash: $ovmf,
                kernel_cmdline: $cmdline,
                artifact_registry: { url: $registry_url, sha256: $registry_sha },
                per_template: {
                  small:    $small,
                  medium:   $medium,
                  large:    $large,
                  "2xlarge": $xl2,
                  "4xlarge": $xl4
                }
              }')
          else
            SEV_BLOCK_JSON='{"note":"SEV measurement not computed in this run (rootfs URL not configured)"}'
          fi

          jq -n \
            --arg tee_image "${TEE_IMAGE}@${TEE_DIGEST}" \
            --arg tee_image_tag "${TEE_IMAGE}:${BUILDTAG}" \
            --arg tee_digest "$TEE_DIGEST" \
            --arg base_image "${BASE_IMAGE}:${BUILDTAG}" \
            --arg base_digest "$BASE_DIGEST" \
            --arg compose_sha "$COMPOSE_SHA" \
            --arg compose_image_ref "${TEE_IMAGE}@${TEE_DIGEST}" \
            --arg dockerfile_sha "$DOCKERFILE_SHA" \
            --arg commit "${{ github.sha }}" \
            --arg ref "${{ github.ref }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg timestamp "$TIMESTAMP" \
            --arg rtmr3 "$RTMR3" \
            --arg secretvm_release "$SECRETVM_RELEASE" \
            --arg rootfs_variant "$ROOTFS_VARIANT" \
            --arg rootfs_tdx_sha256 "$ROOTFS_TDX_SHA256" \
            --arg baked_network "${{ steps.network-config.outputs.network }}" \
            --arg baked_diamond "${{ steps.network-config.outputs.diamond_contract_address }}" \
            --arg baked_mor_token "${{ steps.network-config.outputs.mor_token_address }}" \
            --arg baked_blockscout "${{ steps.network-config.outputs.blockscout_api_url }}" \
            --arg baked_chain_id "${{ steps.network-config.outputs.eth_node_chain_id }}" \
            --arg log_level_app "${{ steps.baked-loglevels.outputs.log_level_app }}" \
            --arg log_level_tcp "${{ steps.baked-loglevels.outputs.log_level_tcp }}" \
            --arg log_level_eth_rpc "${{ steps.baked-loglevels.outputs.log_level_eth_rpc }}" \
            --arg log_level_storage "${{ steps.baked-loglevels.outputs.log_level_storage }}" \
            --arg log_color "${{ steps.baked-loglevels.outputs.log_color }}" \
            --arg log_json "${{ steps.baked-loglevels.outputs.log_json }}" \
            --arg log_is_prod "${{ steps.baked-loglevels.outputs.log_is_prod }}" \
            --argjson sev_block "$SEV_BLOCK_JSON" \
            '{
              tee_image: $tee_image,
              tee_image_tag: $tee_image_tag,
              tee_image_digest: $tee_digest,
              base_image: $base_image,
              base_image_digest: $base_digest,
              compose_sha256: $compose_sha,
              compose_image_reference: $compose_image_ref,
              dockerfile_tee_sha256: $dockerfile_sha,
              build: {
                commit: $commit,
                ref: $ref,
                workflow: "build.yml",
                run_id: $run_id,
                run_url: $run_url,
                timestamp: $timestamp
              },
              tee_platforms: ["intel-tdx", "amd-sev-snp"],
              runtime_secrets_only: [
                "WALLET_PRIVATE_KEY",
                "ETH_NODE_ADDRESS",
                "MODELS_CONFIG_CONTENT",
                "WEB_PUBLIC_URL",
                "COOKIE_CONTENT"
              ],
              baked_env: {
                network: $baked_network,
                DIAMOND_CONTRACT_ADDRESS: $baked_diamond,
                MOR_TOKEN_ADDRESS: $baked_mor_token,
                BLOCKSCOUT_API_URL: $baked_blockscout,
                ETH_NODE_CHAIN_ID: $baked_chain_id,
                PROXY_STORE_CHAT_CONTEXT: "false",
                LOG_COLOR: $log_color,
                LOG_JSON: $log_json,
                LOG_IS_PROD: $log_is_prod,
                LOG_LEVEL_APP: $log_level_app,
                LOG_LEVEL_TCP: $log_level_tcp,
                LOG_LEVEL_ETH_RPC: $log_level_eth_rpc,
                LOG_LEVEL_STORAGE: $log_level_storage,
                ENVIRONMENT: "production"
              },
              measurements: {
                intel_tdx: {
                  rtmr3: $rtmr3,
                  secretvm_release: $secretvm_release,
                  rootfs_variant: $rootfs_variant,
                  rootfs_sha256: $rootfs_tdx_sha256,
                  note: "RTMR3 measures (compose + rootfs); template-independent. RTMR0-2 verified at runtime via SecretVM TDX artifact registry lookup."
                },
                amd_sev_snp: $sev_block
              }
            }' > tee-attestation-manifest.json

          echo "📋 TEE attestation manifest:" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat tee-attestation-manifest.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Sign and attach TEE attestation manifest
        run: |
          TEE_IMAGE="${{ needs.Generate-Tag.outputs.image_name }}-tee"
          DIGEST=${{ steps.capture-digest.outputs.digest }}
          cosign attest --yes \
            --predicate tee-attestation-manifest.json \
            --type https://morpheusais.github.io/tee-attestation/v1 \
            "$TEE_IMAGE@$DIGEST"
          echo "🔏 TEE attestation manifest signed and attached to \`$TEE_IMAGE@$DIGEST\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload deployed compose as artifact
        uses: actions/upload-artifact@v6
        with:
          name: docker-compose-tee-deployed-${{ needs.Generate-Tag.outputs.tag_name }}
          path: /tmp/docker-compose.tee.deployed.yml

      - name: Push TEE Latest Tags
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test' }}
        run: |
          TEE_IMAGE="${{ needs.Generate-Tag.outputs.image_name }}-tee"
          BUILDTAG=${{ needs.Generate-Tag.outputs.tag_name }}
          
          if [ "${{ github.ref_name }}" == "main" ]; then
            LATEST_TAG="latest"
          else
            LATEST_TAG="latest-test"
          fi
          
          docker buildx imagetools create -t $TEE_IMAGE:$LATEST_TAG $TEE_IMAGE:$BUILDTAG || (echo "❌ Failed to create TEE :$LATEST_TAG tag" && exit 1)
          echo "✅ TEE Image tag pushed: $TEE_IMAGE:$LATEST_TAG"

  Deploy-SecretVM-Test:
    name: Deploy TEE Image to SecretVM (test)
    if: |
      (github.ref == 'refs/heads/test' || startsWith(github.ref, 'refs/heads/cicd/')) &&
      (needs.changes.outputs.proxy == 'true' || github.event_name == 'workflow_dispatch')
    needs:
      - changes
      - Generate-Tag
      - GHCR-Build-and-Push-TEE
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Download deployed compose artifact
        uses: actions/download-artifact@v7
        with:
          name: docker-compose-tee-deployed-${{ needs.Generate-Tag.outputs.tag_name }}
          path: /tmp

      - name: Deploy to SecretVM test instance
        env:
          SECRETVM_API_KEY: ${{ secrets.SECRETVM_API_KEY }}
          SECRETVM_TEST_VM_UUID: ${{ secrets.SECRETVM_TEST_VM_UUID }}
          SECRETVM_TEST_ENV_B64: ${{ secrets.SECRETVM_TEST_ENV }}
        run: |
          if [ -z "$SECRETVM_API_KEY" ] || [ -z "$SECRETVM_TEST_VM_UUID" ] || [ -z "$SECRETVM_TEST_ENV_B64" ]; then
            echo "⏭️  SecretVM secrets not configured — skipping deploy" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          npm install --global secretvm-cli

          echo "$SECRETVM_TEST_ENV_B64" | base64 -d > /tmp/secretvm-test.env

          echo "🚀 Updating SecretVM test instance ${SECRETVM_TEST_VM_UUID:0:8}..." >> $GITHUB_STEP_SUMMARY

          secretvm-cli -k "$SECRETVM_API_KEY" vm edit "$SECRETVM_TEST_VM_UUID" \
            --docker-compose /tmp/docker-compose.tee.deployed.yml \
            --env /tmp/secretvm-test.env

          rm -f /tmp/secretvm-test.env

          echo "✅ SecretVM test instance updated with new TEE image" >> $GITHUB_STEP_SUMMARY
          echo "   Compose: \`docker-compose-tee-deployed-${{ needs.Generate-Tag.outputs.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "   Expected RTMR3: \`${{ needs.GHCR-Build-and-Push-TEE.outputs.rtmr3 }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Verify attestation after deploy
        env:
          SECRETVM_API_KEY: ${{ secrets.SECRETVM_API_KEY }}
          SECRETVM_TEST_VM_UUID: ${{ secrets.SECRETVM_TEST_VM_UUID }}
          EXPECTED_RTMR3: ${{ needs.GHCR-Build-and-Push-TEE.outputs.rtmr3 }}
        run: |
          if [ -z "$SECRETVM_API_KEY" ] || [ -z "$SECRETVM_TEST_VM_UUID" ] || [ -z "$EXPECTED_RTMR3" ]; then
            echo "⏭️  Skipping attestation verify (missing secrets or RTMR3)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "⏳ Waiting for VM to reboot with new image..." >> $GITHUB_STEP_SUMMARY

          # vm attestation returns raw TDX quote hex; extract RTMR3 from known offset
          # TDX Quote v4: 48-byte header + TD Report Body
          # RTMR3 at body offset 472 bytes (48 bytes long)
          RTMR3_HEX_START=$(( (48 + 472) * 2 ))
          RTMR3_HEX_LEN=96

          MAX_ATTEMPTS=12
          SLEEP_SECS=30
          MATCHED=false

          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "  Attestation poll attempt $i/$MAX_ATTEMPTS..."

            RAW_QUOTE=$(secretvm-cli -k "$SECRETVM_API_KEY" vm attestation "$SECRETVM_TEST_VM_UUID" 2>/dev/null) || true

            LIVE_RTMR3=$(echo "$RAW_QUOTE" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              raw = data.get('result', '')
              rtmr3 = raw[$RTMR3_HEX_START:$RTMR3_HEX_START+$RTMR3_HEX_LEN]
              if len(rtmr3) == $RTMR3_HEX_LEN:
                  print(rtmr3)
              else:
                  print('')
          except:
              print('')
          " 2>/dev/null)

            if [ -n "$LIVE_RTMR3" ]; then
              echo "  Got RTMR3: ${LIVE_RTMR3:0:16}..."

              if [ "$LIVE_RTMR3" = "$EXPECTED_RTMR3" ]; then
                MATCHED=true
                echo "🎉 **RTMR3 MATCH** — attestation verified!" >> $GITHUB_STEP_SUMMARY
                echo "   Live RTMR3:     \`$LIVE_RTMR3\`" >> $GITHUB_STEP_SUMMARY
                echo "   Expected RTMR3: \`$EXPECTED_RTMR3\`" >> $GITHUB_STEP_SUMMARY
                break
              else
                echo "  RTMR3 mismatch (VM may still be rebooting)"
                echo "    live:     $LIVE_RTMR3"
                echo "    expected: $EXPECTED_RTMR3"
              fi
            else
              echo "  No attestation data yet (VM may still be starting)"
            fi

            if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
              sleep $SLEEP_SECS
            fi
          done

          if [ "$MATCHED" = false ]; then
            echo "⚠️ **RTMR3 mismatch after ${MAX_ATTEMPTS} attempts** (${SLEEP_SECS}s × ${MAX_ATTEMPTS} = $(( SLEEP_SECS * MAX_ATTEMPTS ))s)" >> $GITHUB_STEP_SUMMARY
            echo "   Live RTMR3:     \`${LIVE_RTMR3:-unavailable}\`" >> $GITHUB_STEP_SUMMARY
            echo "   Expected RTMR3: \`$EXPECTED_RTMR3\`" >> $GITHUB_STEP_SUMMARY
            echo "   This may indicate the VM is still rebooting, or there is a genuine mismatch." >> $GITHUB_STEP_SUMMARY
            echo "   Check manually: \`secretvm-cli vm attestation $SECRETVM_TEST_VM_UUID\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

