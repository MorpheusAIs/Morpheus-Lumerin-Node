  Build-Service-Executables:
    name: Build Service Executables
    if: |
      github.repository == 'MorpheusAIs/Morpheus-Lumerin-Node' &&
      !(github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test') && needs.changes.outputs.proxy != 'true') &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.build_all_os == 'true') 
      )
    needs:
      - changes
      - Generate-Tag
      - Go-Module-Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            proxy-router/go.sum
            cli/go.sum

      - name: Cache Go build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Build proxy-router executables for all platforms 
        run: |
          FULLTAG=${{ needs.Generate-Tag.outputs.vfull }}
          cd proxy-router
          
          # Ensure go.sum is up to date and download dependencies
          go mod tidy
          go mod download
          
          # Build all platforms in parallel using background jobs
          echo "🚀 Building proxy-router executables..."

          # Linux X64
          echo "🚀 Building Linux X64 executable..."
          TAG_NAME=${{ needs.Generate-Tag.outputs.tag_name }} GOOS=linux GOARCH=amd64 OUTPUT=proxy-router-${FULLTAG}-linux-amd64 ./build.sh || (echo "❌ Failed to build Linux X64 executable" && exit 1)
          mv proxy-router linux-x86_64-morpheus-router-${FULLTAG}
          
          # Linux ARM64 (Raspberry Pi, AWS Graviton)
          echo "🚀 Building Linux ARM64 executable..."
          TAG_NAME=${{ needs.Generate-Tag.outputs.tag_name }} GOOS=linux GOARCH=arm64 OUTPUT=proxy-router-${FULLTAG}-linux-arm64 ./build.sh || (echo "❌ Failed to build Linux ARM64 executable" && exit 1)
          mv proxy-router linux-arm64-morpheus-router-${FULLTAG}
          
          # macOS Intel
          echo "🚀 Building macOS X64 executable..."
          TAG_NAME=${{ needs.Generate-Tag.outputs.tag_name }} GOOS=darwin GOARCH=amd64 OUTPUT=proxy-router-${FULLTAG}-mac-amd64 ./build.sh || (echo "❌ Failed to build macOS X64 executable" && exit 1)
          mv proxy-router mac-x64-morpheus-router-${FULLTAG}
          
          # macOS ARM (Apple Silicon)
          echo "🚀 Building macOS ARM64 executable..."
          TAG_NAME=${{ needs.Generate-Tag.outputs.tag_name }} GOOS=darwin GOARCH=arm64 OUTPUT=proxy-router-${FULLTAG}-mac-arm64 ./build.sh || (echo "❌ Failed to build macOS ARM64 executable" && exit 1)
          mv proxy-router mac-arm64-morpheus-router-${FULLTAG}
          
          # Windows X64
          echo "🚀 Building Windows X64 executable..."
          TAG_NAME=${{ needs.Generate-Tag.outputs.tag_name }} GOOS=windows GOARCH=amd64 OUTPUT=proxy-router-${FULLTAG}-win-amd64.exe ./build.sh || (echo "❌ Failed to build Windows X64 executable" && exit 1)
          mv proxy-router win-x64-morpheus-router-${FULLTAG}.exe
          
          echo "✅ Built Proxy Router executables for all platforms"

      - name: Build CLI Executables for all platforms
        run: |
          FULLTAG=${{ needs.Generate-Tag.outputs.vfull }}
          cd cli
          
          # Ensure go.sum is up to date and download dependencies
          go mod tidy
          go mod download
          
          # Build all platforms in parallel
          echo "🚀 Building CLI executables..."
          
          # Linux X64
          echo "🚀 Building Linux X64 CLI executable..."
          GOOS=linux GOARCH=amd64 make build || (echo "❌ Failed to build Linux X64 executable" && exit 1)
          mv mor-cli linux-x86_64-morpheus-cli-${FULLTAG}
          
          # Linux ARM64 (Raspberry Pi, AWS Graviton)
          echo "🚀 Building Linux ARM64 CLI executable..."
          GOOS=linux GOARCH=arm64 make build || (echo "❌ Failed to build Linux ARM64 executable" && exit 1)
          mv mor-cli linux-arm64-morpheus-cli-${FULLTAG}
          
          # macOS Intel
          echo "🚀 Building macOS X64 CLI executable..."
          GOOS=darwin GOARCH=amd64 make build || (echo "❌ Failed to build macOS X64 executable" && exit 1)
          mv mor-cli mac-x64-morpheus-cli-${FULLTAG}
          
          # macOS ARM (Apple Silicon)
          echo "🚀 Building macOS ARM64 CLI executable..."
          GOOS=darwin GOARCH=arm64 make build || (echo "❌ Failed to build macOS ARM64 executable" && exit 1)
          mv mor-cli mac-arm64-morpheus-cli-${FULLTAG}
          
          # Windows X64
          echo "🚀 Building Windows X64 CLI executable..."
          GOOS=windows GOARCH=amd64 make build || (echo "❌ Failed to build Windows X64 executable" && exit 1)
          mv mor-cli win-x64-morpheus-cli-${FULLTAG}.exe
          
          echo "✅ Built CLI executables for all platforms"


      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v6
        with:
          name: cli
          path: |
            cli/linux-x86_64-morpheus-cli-${{ needs.Generate-Tag.outputs.vfull }}
            cli/linux-arm64-morpheus-cli-${{ needs.Generate-Tag.outputs.vfull }}
            cli/mac-x64-morpheus-cli-${{ needs.Generate-Tag.outputs.vfull }}
            cli/mac-arm64-morpheus-cli-${{ needs.Generate-Tag.outputs.vfull }}
            cli/win-x64-morpheus-cli-${{ needs.Generate-Tag.outputs.vfull }}.exe
    
      - name: Upload ProxyRouter artifacts
        uses: actions/upload-artifact@v6
        with:
          name: proxy-router
          path: |
            proxy-router/linux-x86_64-morpheus-router-${{ needs.Generate-Tag.outputs.vfull }}
            proxy-router/linux-arm64-morpheus-router-${{ needs.Generate-Tag.outputs.vfull }}
            proxy-router/mac-x64-morpheus-router-${{ needs.Generate-Tag.outputs.vfull }}
            proxy-router/mac-arm64-morpheus-router-${{ needs.Generate-Tag.outputs.vfull }}
            proxy-router/win-x64-morpheus-router-${{ needs.Generate-Tag.outputs.vfull }}.exe

  Deploy-to-Titan:
    name: Deploy to Titan via GitHub Actions
    if: |
      github.repository == 'MorpheusAIs/Morpheus-Lumerin-Node' &&
      (needs.changes.outputs.proxy == 'true' || github.event_name == 'workflow_dispatch') &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.build_all_os == 'true' && github.event.inputs.create_deployment == 'true')
      )
    needs:
      - changes
      - Generate-Tag
      - GHCR-Build-and-Push
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.TITAN_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TITAN_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to Titan ECS
        run: |
          # For deployment, use the newly built image
          BUILDTAG=${{ needs.Generate-Tag.outputs.tag_name }}
          BUILDIMAGE=${{ needs.Generate-Tag.outputs.image_name }}
          
          # Determine environment based on branch
          if [ "${{ github.ref_name }}" == "test" ]; then
            ENV="dev"
          elif [ "${{ github.ref_name }}" == "main" ]; then
            ENV="lmn"
          else
            echo "❌ Unsupported branch for deployment: ${{ github.ref_name }}"
            exit 1
          fi
          
          echo "🚀 Deploying to Titan AWS - Environment: $ENV"
          echo "📦 Container Image: $BUILDIMAGE:$BUILDTAG"
          
          # ECS deployment variables
          CLUSTER_NAME="ecs-morpheus-router-${ENV}-use1"
          SERVICE_NAME="svc-morpheus-router-${ENV}-use1"
          TASK_FAMILY="tsk-morpheus-router"
          CONTAINER_NAME="morpheus-router-container"
          
          # Get current task definition
          echo "📋 Retrieving current task definition..."
          CURRENT_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition' \
            --output json)
          
          if [ $? -ne 0 ]; then
            echo "❌ Failed to retrieve current task definition"
            exit 1
          fi
          
          # Update the image in the task definition
          echo "🔄 Creating new task definition with image: $BUILDIMAGE:$BUILDTAG"
          NEW_TASK_DEF=$(echo "$CURRENT_TASK_DEF" | jq --arg IMAGE "$BUILDIMAGE:$BUILDTAG" --arg CONTAINER "$CONTAINER_NAME" '
            {
              family: .family,
              networkMode: .networkMode,
              requiresCompatibilities: .requiresCompatibilities,
              cpu: .cpu,
              memory: .memory,
              taskRoleArn: .taskRoleArn,
              executionRoleArn: .executionRoleArn,
              volumes: .volumes,
              containerDefinitions: (.containerDefinitions | map(
                if .name == $CONTAINER then
                  .image = $IMAGE
                else
                  .
                end
              ))
            }
          ')
          
          # Debug: Check if JSON is valid
          echo "🔍 Validating JSON structure..."
          echo "$NEW_TASK_DEF" | jq empty
          if [ $? -ne 0 ]; then
            echo "❌ Generated JSON is invalid"
            echo "Generated JSON:"
            echo "$NEW_TASK_DEF"
            exit 1
          fi
          
          # Debug: Show task definition summary
          echo "🔍 Task definition summary:"
          echo "$NEW_TASK_DEF" | jq '.family, .cpu, .memory, .networkMode, .requiresCompatibilities, (.containerDefinitions | length)'
          
          # Register new task definition
          echo "📝 Registering new task definition..."
          
          # Save JSON to temporary file to avoid stdin issues
          TEMP_JSON_FILE="/tmp/task_definition_$$.json"
          echo "$NEW_TASK_DEF" > "$TEMP_JSON_FILE"
          
          # Validate the temp file
          jq empty "$TEMP_JSON_FILE"
          if [ $? -ne 0 ]; then
            echo "❌ Temporary file contains invalid JSON"
            rm -f "$TEMP_JSON_FILE"
            exit 1
          fi
          
          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://$TEMP_JSON_FILE" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          # Clean up temp file
          rm -f "$TEMP_JSON_FILE"
          
          if [ $? -ne 0 ] || [ -z "$NEW_TASK_ARN" ]; then
            echo "❌ Failed to register new task definition"
            exit 1
          fi
          
          echo "✅ New task definition registered: $NEW_TASK_ARN"
          
          # Update the ECS service
          echo "🔄 Updating ECS service..."
          UPDATE_RESULT=$(aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --task-definition "$NEW_TASK_ARN" \
            --force-new-deployment \
            --query 'service.{serviceName:serviceName,taskDefinition:taskDefinition,desiredCount:desiredCount,runningCount:runningCount,pendingCount:pendingCount}' \
            --output json)
          
          echo "📊 Service Update Summary:"
          echo "$UPDATE_RESULT" | jq .
          
          if [ $? -ne 0 ]; then
            echo "❌ Failed to update ECS service"
            exit 1
          fi
          
          echo "✅ ECS service update initiated successfully"
          echo "🎯 Environment: $ENV"
          echo "🏗️  Cluster: $CLUSTER_NAME"
          echo "⚙️  Service: $SERVICE_NAME"
          echo "📦 Image: $BUILDIMAGE:$BUILDTAG"
          echo "📋 Task Definition: $NEW_TASK_ARN"
          
          # Wait for deployment to stabilize
          # ECS lifecycle: stopTimeout=120s (SIGTERM→SIGKILL) + deregistration_delay ≤30s
          #   + new task image pull/start + ALB health checks (healthy_threshold×interval ≈90s)
          # Worst-case ~4 min; enforce a 180s floor so health-check retries aren't wasted on the old task.
          DEPLOY_WAIT_FLOOR_SECS=180
          echo "⏳ Waiting for ECS service to stabilize (default waiter: up to 10 min at 40×15s)..."
          WAIT_START=$(date +%s)
          set +e
          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --cli-read-timeout 900 \
            --cli-connect-timeout 60
          STABILIZATION_STATUS=$?
          WAIT_ELAPSED=$(( $(date +%s) - WAIT_START ))
          set -e
          
          if [ $STABILIZATION_STATUS -eq 0 ]; then
            echo "✅ ECS service stabilized after ${WAIT_ELAPSED}s"
          else
            echo "⚠️ ECS wait returned status $STABILIZATION_STATUS after ${WAIT_ELAPSED}s, continuing with health check..."
          fi
          
          REMAINING=$(( DEPLOY_WAIT_FLOOR_SECS - WAIT_ELAPSED ))
          if [ $REMAINING -gt 0 ]; then
            echo "⏳ Ensuring minimum ${DEPLOY_WAIT_FLOOR_SECS}s deploy wait (sleeping ${REMAINING}s more)..."
            sleep $REMAINING
          fi
          
          # Determine the public endpoint for health check
          if [ "$ENV" == "dev" ]; then
            HEALTH_ENDPOINT="https://morpheusapi.dev.lumerin.io/healthcheck"
          elif [ "$ENV" == "lmn" ]; then
            HEALTH_ENDPOINT="https://morpheusapi.lmn.lumerin.io/healthcheck"
          fi
          
          echo "🔍 Verifying deployment version at: $HEALTH_ENDPOINT"
          
          # Wait for the service to be reachable and verify version
          MAX_HEALTH_RETRIES=20
          HEALTH_RETRY_COUNT=0
          VERSION_VERIFIED=false
          
          # Disable errexit for the health-check loop so curl timeouts (exit 28) don't kill the script
          set +e
          while [ $HEALTH_RETRY_COUNT -lt $MAX_HEALTH_RETRIES ]; do
            echo "🔄 Health check attempt $((HEALTH_RETRY_COUNT + 1))/$MAX_HEALTH_RETRIES..."
            
            # Get health check response with browser-like headers to bypass WAF
            HEALTH_RESPONSE=$(curl -s --max-time 10 \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36" \
              -H "Accept: application/json, text/plain, */*" \
              -H "Accept-Language: en-US,en;q=0.9" \
              "$HEALTH_ENDPOINT" 2>/dev/null)
            CURL_STATUS=$?
            
            if [ $CURL_STATUS -eq 0 ] && [ -n "$HEALTH_RESPONSE" ]; then
              echo "📡 Health response: $HEALTH_RESPONSE"
              
              # Parse version from JSON response
              DEPLOYED_VERSION=$(echo "$HEALTH_RESPONSE" | jq -r '(.version // .Version // empty)' 2>/dev/null)
              UPTIME=$(echo "$HEALTH_RESPONSE" | jq -r '(.uptime // .Uptime // empty)' 2>/dev/null)
              STATUS=$(echo "$HEALTH_RESPONSE" | jq -r '(.status // .Status // empty)' 2>/dev/null)
              
              if [ -n "$DEPLOYED_VERSION" ] && [ "$STATUS" = "healthy" ]; then
                echo "🏥 Service Status: $STATUS"
                echo "📦 Deployed Version: $DEPLOYED_VERSION"
                echo "⏰ Service Uptime: $UPTIME"
                
                # Check if deployed version matches expected version
                if [[ "$DEPLOYED_VERSION" == *"$BUILDTAG"* ]] || [[ "$BUILDTAG" == *"$DEPLOYED_VERSION"* ]]; then
                  echo "✅ Version verification successful! Deployed version matches expected tag."
                  VERSION_VERIFIED=true
                  break
                else
                  echo "⚠️ Version mismatch - Expected: $BUILDTAG, Deployed: $DEPLOYED_VERSION"
                fi
              else
                echo "⚠️ Service not healthy or version not available"
              fi
            else
              echo "⚠️ Health check failed (curl status: $CURL_STATUS)"
            fi
            
            HEALTH_RETRY_COUNT=$((HEALTH_RETRY_COUNT + 1))
            if [ $HEALTH_RETRY_COUNT -lt $MAX_HEALTH_RETRIES ]; then
              echo "⏳ Waiting 15 seconds before retry..."
              sleep 15
            fi
          done
          set -e
          
          # Final deployment status
          if [ "$VERSION_VERIFIED" = true ]; then
            echo ""
            echo "🎉 Deployment completed successfully!"
            echo "✅ Service is healthy and running the expected version"
            echo "🌐 Health Check URL: $HEALTH_ENDPOINT"
          else
            echo ""
            echo "❌ Deployment verification failed!"
            echo "🔍 The service may still be starting up or there may be an issue"
            echo "🌐 Manual check: $HEALTH_ENDPOINT"
            echo "🏗️  Expected version: $BUILDTAG"
            if [ -n "$DEPLOYED_VERSION" ]; then
              echo "📦 Currently deployed: $DEPLOYED_VERSION"
            fi
            echo ""
            echo "ℹ️ This may be a temporary issue. Check the health endpoint in a few minutes."
            echo "ℹ️ If the issue persists, check AWS ECS console and CloudWatch logs."
            
            # Don't fail the deployment for version mismatch, as it might be a timing issue
            # The ECS service update was successful, version verification is informational
            echo "⚠️ Continuing with warning - ECS deployment completed but version verification inconclusive"
          fi

  Drain-Morpheus-C-Node:
    # Quiet the C-Node immediately BEFORE the C-Node itself is rolled — and, per the
    # job graph below, only AFTER both P-Nodes have already been updated one at a time
    # (P-Node-1 -> P-Node-2). We deliberately do NOT drain during the provider rolls:
    # with two independent on-chain providers serving the same models, the C-Node must
    # stay live in the NLB so the API Gateway's provider-failover (mark the dead
    # session FAILED -> reopen on the surviving provider; see
    # Morpheus-Marketplace-API/src/api/v1/chat/chat_failover.py) keeps traffic flowing
    # while each provider restarts.
    #
    # Why drain at all (for the C-Node roll): the proxy-router on the C-Node keeps a
    # BadgerDB of active sessions. On prd the BadgerDB is ephemeral on Fargate (no EFS)
    # and the router rehydrates state on boot from on-chain data. Draining first means
    # warm sessions see a clean upstream failure (NLB returns 503 / connection closed)
    # instead of a half-dead mid-stream hang during the C-Node restart.
    #
    # This job deregisters the running C-Node task ENI from every target group on the
    # C-Node NLB. The target groups have connection_termination=true (see
    # Morpheus-Infra/environments/02-morpheus_c_node/.terragrunt/02_mor_router_svc.tf),
    # so existing TCP sessions are closed promptly. The ECS service and its task
    # continue to run; we are only manipulating LB membership.
    #
    # `!cancelled()` + explicit result checks: on `test`, P-Node-1 deploys DEV
    # provider and P-Node-2 is skipped (HA is prd-only); on `main`, BOTH provider
    # rolls must SUCCEED before the C-Node is touched.
    name: Drain Morpheus C-Node from NLB
    if: |
      !cancelled() &&
      github.repository == 'MorpheusAIs/Morpheus-Lumerin-Node' &&
      (needs.changes.outputs.proxy == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.GHCR-Build-and-Push.result == 'success' &&
      (needs.Deploy-to-Morpheus-P-Node.result == 'success' || needs.Deploy-to-Morpheus-P-Node.result == 'skipped') &&
      (needs.Deploy-to-Morpheus-P-Node-2.result == 'success' || needs.Deploy-to-Morpheus-P-Node-2.result == 'skipped') &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.build_all_os == 'true' && github.event.inputs.create_deployment == 'true')
      )
    needs:
      - changes
      - Generate-Tag
      - GHCR-Build-and-Push
      - Deploy-to-Morpheus-P-Node
      - Deploy-to-Morpheus-P-Node-2
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    outputs:
      tg_arns: ${{ steps.drain.outputs.tg_arns }}
      drained_ips: ${{ steps.drain.outputs.drained_ips }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.MORPHEUS_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MORPHEUS_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Deregister C-Node targets from all NLB target groups
        id: drain
        run: |
          set -euo pipefail

          if [ "${{ github.ref_name }}" == "test" ]; then
            ENV="dev"
          elif [ "${{ github.ref_name }}" == "main" ]; then
            ENV="prd"
          else
            echo "❌ Unsupported branch for drain: ${{ github.ref_name }}"
            exit 1
          fi

          CLUSTER_NAME="ecs-${ENV}-morpheus-engine"
          SERVICE_NAME="svc-${ENV}-router"

          echo "🎯 Discovering target groups for ${CLUSTER_NAME}/${SERVICE_NAME}..."
          TG_ARNS=$(aws ecs describe-services \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --query 'services[0].loadBalancers[].targetGroupArn' \
            --output text)

          if [ -z "$TG_ARNS" ] || [ "$TG_ARNS" == "None" ]; then
            echo "❌ No target groups resolved for service $SERVICE_NAME"
            exit 1
          fi

          echo "📋 Target groups: $TG_ARNS"

          DRAINED_IPS=""
          for TG_ARN in $TG_ARNS; do
            echo ""
            echo "🔄 Inspecting $TG_ARN..."
            TARGETS_JSON=$(aws elbv2 describe-target-health \
              --target-group-arn "$TG_ARN" \
              --query 'TargetHealthDescriptions[].Target' \
              --output json)
            TARGET_COUNT=$(echo "$TARGETS_JSON" | jq 'length')

            if [ "$TARGET_COUNT" -eq 0 ]; then
              echo "  (no registered targets — nothing to drain)"
              continue
            fi

            # Build --targets Id=...,Port=... arg list
            TARGETS_CLI=$(echo "$TARGETS_JSON" | jq -r '.[] | "Id=\(.Id),Port=\(.Port)"')
            echo "  Current targets ($TARGET_COUNT):"
            echo "$TARGETS_CLI" | sed 's/^/    /'

            # Collect IPs across all TGs for later reference (deduped)
            IPS=$(echo "$TARGETS_JSON" | jq -r '.[].Id')
            DRAINED_IPS="$DRAINED_IPS $IPS"

            echo "  Calling DeregisterTargets..."
            # shellcheck disable=SC2086
            aws elbv2 deregister-targets \
              --target-group-arn "$TG_ARN" \
              --targets $TARGETS_CLI
          done

          # connection_termination=true on router TGs closes live TCP sessions in under
          # a second; svc TG has deregistration_delay=0 and API TG has 30. 45s leaves
          # plenty of margin for LB state to propagate across AZs before the C-Node
          # task is rolled (both P-Nodes have already been updated by this point).
          DRAIN_WAIT=45
          echo ""
          echo "⏳ Waiting ${DRAIN_WAIT}s for deregistration to propagate..."
          sleep $DRAIN_WAIT

          # Flatten outputs (newline → space, then comma for workflow output)
          TG_ARNS_CSV=$(echo "$TG_ARNS" | tr -s '[:space:]' ',' | sed 's/^,//;s/,$//')
          IPS_CSV=$(echo "$DRAINED_IPS" | tr -s '[:space:]' ',' | sed 's/^,//;s/,$//' | awk -F, '{for (i=1;i<=NF;i++) if (!seen[$i]++) printf (i>1?",":"")"%s",$i; print ""}')

          echo "tg_arns=$TG_ARNS_CSV" >> "$GITHUB_OUTPUT"
          echo "drained_ips=$IPS_CSV" >> "$GITHUB_OUTPUT"

          {
            echo "### 🚰 C-Node drain complete"
            echo ""
            echo "**Environment:** \`$ENV\`"
            echo "**Target groups drained:** \`$TG_ARNS_CSV\`"
            echo "**Target IPs removed:** \`$IPS_CSV\`"
            echo ""
            echo "Both P-Nodes are already updated; the NLB will return clean upstream errors until the new C-Node task is re-registered."
          } >> "$GITHUB_STEP_SUMMARY"

  Deploy-to-Morpheus-C-Node:
    name: Deploy to Morpheus Consumer via GitHub
    # NOTE on `needs` + skipped dependencies:
    # GitHub Actions' default job condition is implicit `success()`, which returns
    # false when ANY needed job was skipped. Both P-Node jobs are main-only (see their
    # own `if`), so on a `test` deploy `Deploy-to-Morpheus-P-Node-2` is skipped
    # (HA is prd-only) while P-Node-1 deploys DEV. Without an explicit `if` that
    # tolerates those skips, the C-Node deploy gets skipped too — which is exactly what
    # bit us on the first v7 test run: the drain job ran and deregistered the C-Node,
    # then the actual deploy silently skipped, leaving dev without a replacement task.
    #
    # This `if` explicitly allows the skipped P-Node outcomes, while still gating on
    # drain + GHCR success and requiring we're on a deploy-eligible branch.
    # `!cancelled()` keeps the guard working if a user cancels mid-run.
    if: |
      !cancelled() &&
      github.repository == 'MorpheusAIs/Morpheus-Lumerin-Node' &&
      (needs.changes.outputs.proxy == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.GHCR-Build-and-Push.result == 'success' &&
      needs.Drain-Morpheus-C-Node.result == 'success' &&
      (needs.Deploy-to-Morpheus-P-Node.result == 'success' || needs.Deploy-to-Morpheus-P-Node.result == 'skipped') &&
      (needs.Deploy-to-Morpheus-P-Node-2.result == 'success' || needs.Deploy-to-Morpheus-P-Node-2.result == 'skipped') &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.build_all_os == 'true' && github.event.inputs.create_deployment == 'true')
      )
    needs:
      - changes
      - Generate-Tag
      - GHCR-Build-and-Push
      - Drain-Morpheus-C-Node
      - Deploy-to-Morpheus-P-Node
      - Deploy-to-Morpheus-P-Node-2
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.MORPHEUS_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MORPHEUS_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Deploy to Morpheus ECS
        run: |
          # For deployment testing, use existing image instead of newly built one
          BUILDTAG=${{ needs.Generate-Tag.outputs.tag_name }}
          BUILDIMAGE=${{ needs.Generate-Tag.outputs.image_name }}
          
          # Determine environment based on branch
          if [ "${{ github.ref_name }}" == "test" ]; then
            ENV="dev"
          elif [ "${{ github.ref_name }}" == "main" ]; then
            ENV="prd"
          else
            echo "❌ Unsupported branch for deployment: ${{ github.ref_name }}"
            exit 1
          fi
          
          echo "🚀 Deploying to Morpheus AWS - Environment: $ENV"
          echo "📦 Container Image: $BUILDIMAGE:$BUILDTAG"
          
          # ECS deployment variables
          CLUSTER_NAME="ecs-${ENV}-morpheus-engine"
          SERVICE_NAME="svc-${ENV}-router"
          TASK_FAMILY="tsk-${ENV}-router"
          CONTAINER_NAME="router-container"
          
          # Get current task definition
          echo "📋 Retrieving current task definition..."
          CURRENT_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition' \
            --output json)
          
          if [ $? -ne 0 ]; then
            echo "❌ Failed to retrieve current task definition"
            exit 1
          fi
          
          # Update the image in the task definition
          echo "🔄 Creating new task definition with image: $BUILDIMAGE:$BUILDTAG"
          NEW_TASK_DEF=$(echo "$CURRENT_TASK_DEF" | jq --arg IMAGE "$BUILDIMAGE:$BUILDTAG" --arg CONTAINER "$CONTAINER_NAME" '
            {
              family: .family,
              networkMode: .networkMode,
              requiresCompatibilities: .requiresCompatibilities,
              cpu: .cpu,
              memory: .memory,
              taskRoleArn: .taskRoleArn,
              executionRoleArn: .executionRoleArn,
              volumes: .volumes,
              containerDefinitions: (.containerDefinitions | map(
                if .name == $CONTAINER then
                  .image = $IMAGE
                else
                  .
                end
              ))
            }
          ')
          
          # Debug: Check if JSON is valid
          echo "🔍 Validating JSON structure..."
          echo "$NEW_TASK_DEF" | jq empty
          if [ $? -ne 0 ]; then
            echo "❌ Generated JSON is invalid"
            echo "Generated JSON:"
            echo "$NEW_TASK_DEF"
            exit 1
          fi
          
          # Debug: Show task definition summary
          echo "🔍 Task definition summary:"
          echo "$NEW_TASK_DEF" | jq '.family, .cpu, .memory, .networkMode, .requiresCompatibilities, (.containerDefinitions | length)'
          
          # Register new task definition
          echo "📝 Registering new task definition..."
          
          # Save JSON to temporary file to avoid stdin issues
          TEMP_JSON_FILE="/tmp/task_definition_$$.json"
          echo "$NEW_TASK_DEF" > "$TEMP_JSON_FILE"
          
          # Validate the temp file
          jq empty "$TEMP_JSON_FILE"
          if [ $? -ne 0 ]; then
            echo "❌ Temporary file contains invalid JSON"
            rm -f "$TEMP_JSON_FILE"
            exit 1
          fi
          
          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://$TEMP_JSON_FILE" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          # Clean up temp file
          rm -f "$TEMP_JSON_FILE"
          
          if [ $? -ne 0 ] || [ -z "$NEW_TASK_ARN" ]; then
            echo "❌ Failed to register new task definition"
            exit 1
          fi
          
          echo "✅ New task definition registered: $NEW_TASK_ARN"
          
          # Update the ECS service.
          #
          # --health-check-grace-period-seconds 600: ECS ignores LB target health for
          # 10 minutes after the task starts. We need this because the next steps
          # deliberately deregister the new task from the NLB target groups during
          # the rehydration window. Without a generous grace period ECS would see
          # the target as "unhealthy" (since it's not registered anywhere) and the
          # deployment circuit breaker could roll back mid-deployment.
          echo "🔄 Updating ECS service..."
          UPDATE_RESULT=$(aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --task-definition "$NEW_TASK_ARN" \
            --health-check-grace-period-seconds 600 \
            --force-new-deployment \
            --query 'service.{serviceName:serviceName,taskDefinition:taskDefinition,desiredCount:desiredCount,runningCount:runningCount,pendingCount:pendingCount}' \
            --output json)
          
          echo "📊 Service Update Summary:"
          echo "$UPDATE_RESULT" | jq .
          
          if [ $? -ne 0 ]; then
            echo "❌ Failed to update ECS service"
            exit 1
          fi
          
          echo "✅ ECS service update initiated successfully"
          echo "🎯 Environment: $ENV"
          echo "🏗️  Cluster: $CLUSTER_NAME"
          echo "⚙️  Service: $SERVICE_NAME"
          echo "📦 Image: $BUILDIMAGE:$BUILDTAG"
          echo "📋 Task Definition: $NEW_TASK_ARN"

          ##################################################################
          # Controlled-traffic deployment sequence (v7+).
          #
          # Goal: after ECS brings up the new C-Node task, hold traffic off it
          # for CNODE_REHYDRATION_WAIT_SECS so the proxy-router's BadgerDB
          # session rehydration loop can catch up from on-chain state. Only
          # then re-register to the NLB target groups.
          #
          # Flow:
          #   1. Discover TG ARNs from the ECS service.
          #   2. Poll until a task running the NEW task definition is RUNNING
          #      and has a private ENI IP.
          #   3. Deregister that IP from every TG — targets that are still in
          #      "initial" state at this point never serve traffic; targets
          #      that already became "healthy" go through connection_termination
          #      (see Morpheus-Infra 02_mor_router_svc.tf).
          #   4. Sleep CNODE_REHYDRATION_WAIT_SECS (the manual hold window).
          #   5. Re-register and `elbv2 wait target-in-service` on each TG.
          #   6. Fall through to the public /healthcheck version-match loop.
          #
          # The grace period on update-service prevents the ECS circuit
          # breaker from rolling back while the task is deregistered.
          ##################################################################

          # Resolve the rehydration hold (workflow_dispatch override → env → default 90s).
          CNODE_REHYDRATION_WAIT_SECS="${{ github.event.inputs.cnode_rehydration_wait_secs || '90' }}"
          # Guard against non-numeric input
          if ! [[ "$CNODE_REHYDRATION_WAIT_SECS" =~ ^[0-9]+$ ]]; then
            echo "⚠️ cnode_rehydration_wait_secs not numeric ('$CNODE_REHYDRATION_WAIT_SECS'), defaulting to 90"
            CNODE_REHYDRATION_WAIT_SECS=90
          fi
          echo "⏱️  Rehydration hold window: ${CNODE_REHYDRATION_WAIT_SECS}s"

          # Resolve TGs (re-use drain-job output if provided, else rediscover).
          DRAIN_TG_ARNS="${{ needs.Drain-Morpheus-C-Node.outputs.tg_arns }}"
          if [ -n "$DRAIN_TG_ARNS" ]; then
            TG_ARN_LIST=$(echo "$DRAIN_TG_ARNS" | tr ',' ' ')
            echo "📋 Re-using TG ARNs from drain job: $TG_ARN_LIST"
          else
            echo "📋 Discovering TGs from ECS service (drain job output was empty)..."
            TG_ARN_LIST=$(aws ecs describe-services \
              --cluster "$CLUSTER_NAME" \
              --services "$SERVICE_NAME" \
              --query 'services[0].loadBalancers[].targetGroupArn' \
              --output text)
          fi

          if [ -z "$TG_ARN_LIST" ]; then
            echo "❌ No TG ARNs resolved; cannot safely control traffic. Aborting."
            exit 1
          fi

          # Poll (up to 15 min) until the new task is RUNNING and has a private IP.
          # ECS lifecycle:
          #   - stopTimeout=120s to let old task drain (already deregistered by drain job)
          #   - new task goes PROVISIONING → PENDING → RUNNING
          echo "⏳ Waiting for new C-Node task ($NEW_TASK_ARN) to be RUNNING..."
          NEW_TASK_IP=""
          NEW_TASK_DEF_ARN_TRIMMED="${NEW_TASK_ARN##*/}"  # family:revision
          for attempt in $(seq 1 90); do
            RUNNING_TASKS=$(aws ecs list-tasks \
              --cluster "$CLUSTER_NAME" \
              --service-name "$SERVICE_NAME" \
              --desired-status RUNNING \
              --query 'taskArns' \
              --output json)

            # Find a task whose taskDefinitionArn matches the one we just deployed.
            if [ "$(echo "$RUNNING_TASKS" | jq 'length')" != "0" ]; then
              TASK_DETAILS=$(aws ecs describe-tasks \
                --cluster "$CLUSTER_NAME" \
                --tasks $(echo "$RUNNING_TASKS" | jq -r '.[]') \
                --query 'tasks[?lastStatus==`RUNNING`]' \
                --output json)

              NEW_TASK_IP=$(echo "$TASK_DETAILS" | jq -r --arg TD "$NEW_TASK_ARN" '
                .[] | select(.taskDefinitionArn == $TD) |
                .attachments[0].details[] | select(.name == "privateIPv4Address") | .value
              ' | head -n1)

              if [ -n "$NEW_TASK_IP" ] && [ "$NEW_TASK_IP" != "null" ]; then
                echo "✅ New C-Node task running on ENI IP ${NEW_TASK_IP} (after ${attempt} polls)"
                break
              fi
            fi

            sleep 10
          done

          if [ -z "$NEW_TASK_IP" ] || [ "$NEW_TASK_IP" == "null" ]; then
            echo "❌ Timed out waiting for new C-Node task to reach RUNNING with an ENI IP"
            exit 1
          fi

          # Step: block traffic to the new task while rehydration runs.
          echo ""
          echo "🚧 Deregistering new C-Node task IP from all TGs to hold traffic..."
          for TG_ARN in $TG_ARN_LIST; do
            TG_PORT=$(aws elbv2 describe-target-groups \
              --target-group-arns "$TG_ARN" \
              --query 'TargetGroups[0].Port' \
              --output text)
            echo "  $TG_ARN (port $TG_PORT)"
            # Idempotent: if ECS hasn't registered it yet, this is a no-op; if it has,
            # the target enters `draining` (NLB connection_termination=true closes live flows).
            aws elbv2 deregister-targets \
              --target-group-arn "$TG_ARN" \
              --targets "Id=${NEW_TASK_IP},Port=${TG_PORT}" || true
          done

          # Step: rehydration hold. This is the "manual delay from when new task is up
          # before traffic is allowed back in".
          echo ""
          echo "⏳ Holding traffic off new C-Node for ${CNODE_REHYDRATION_WAIT_SECS}s (BadgerDB rehydration window)..."
          sleep "$CNODE_REHYDRATION_WAIT_SECS"

          # Step: re-register. Wrapped in a trap-like always-run block: if any of the
          # subsequent checks fail, we want to make sure we don't leave the TGs empty
          # and the service stuck.
          REREGISTER_SUCCESS=false
          echo ""
          echo "🔁 Re-registering new C-Node task IP to all TGs..."
          for TG_ARN in $TG_ARN_LIST; do
            TG_PORT=$(aws elbv2 describe-target-groups \
              --target-group-arns "$TG_ARN" \
              --query 'TargetGroups[0].Port' \
              --output text)
            echo "  $TG_ARN (port $TG_PORT)"
            aws elbv2 register-targets \
              --target-group-arn "$TG_ARN" \
              --targets "Id=${NEW_TASK_IP},Port=${TG_PORT}"
          done
          REREGISTER_SUCCESS=true

          # Step: wait for each TG to report the new target healthy.
          # healthy_threshold=3, interval=30s → ~90s typical; allow 4 min margin.
          echo ""
          echo "⏳ Waiting for TGs to report new target in service (timeout ~4 min per TG)..."
          WAIT_FAILED_TGS=""
          for TG_ARN in $TG_ARN_LIST; do
            TG_PORT=$(aws elbv2 describe-target-groups \
              --target-group-arns "$TG_ARN" \
              --query 'TargetGroups[0].Port' \
              --output text)
            echo "  ⏳ $TG_ARN (port $TG_PORT)..."
            set +e
            aws elbv2 wait target-in-service \
              --target-group-arn "$TG_ARN" \
              --targets "Id=${NEW_TASK_IP},Port=${TG_PORT}"
            WAIT_STATUS=$?
            set -e
            if [ $WAIT_STATUS -ne 0 ]; then
              echo "    ⚠️ wait target-in-service returned status $WAIT_STATUS"
              WAIT_FAILED_TGS="$WAIT_FAILED_TGS $TG_ARN"
            else
              echo "    ✅ in service"
            fi
          done

          if [ -n "$WAIT_FAILED_TGS" ]; then
            echo "⚠️ One or more TGs did not reach in-service within the waiter timeout:$WAIT_FAILED_TGS"
            echo "    Continuing to public /healthcheck verification — NLB may still come healthy shortly."
          fi

          {
            echo "### 🚦 C-Node controlled redeploy"
            echo ""
            echo "- **New task ENI IP:** \`${NEW_TASK_IP}\`"
            echo "- **Target groups:** \`$(echo $TG_ARN_LIST | tr ' ' ',')\`"
            echo "- **Rehydration hold:** \`${CNODE_REHYDRATION_WAIT_SECS}s\`"
            echo "- **Re-registered:** \`${REREGISTER_SUCCESS}\`"
            if [ -n "$WAIT_FAILED_TGS" ]; then
              echo "- ⚠️ **TGs that did not confirm in-service before waiter timeout:** \`${WAIT_FAILED_TGS}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Determine the public endpoint for health check
          if [ "$ENV" == "dev" ]; then
            HEALTH_ENDPOINT="http://router.dev.mor.org:8082/healthcheck"
          elif [ "$ENV" == "prd" ]; then
            HEALTH_ENDPOINT="http://router.mor.org:8082/healthcheck"
          fi
          
          echo "🔍 Verifying deployment version at: $HEALTH_ENDPOINT"
          
          # Wait for the service to be reachable and verify version
          MAX_HEALTH_RETRIES=20
          HEALTH_RETRY_COUNT=0
          VERSION_VERIFIED=false
          
          # Disable errexit for the health-check loop so curl timeouts (exit 28) don't kill the script
          set +e
          while [ $HEALTH_RETRY_COUNT -lt $MAX_HEALTH_RETRIES ]; do
            echo "🔄 Health check attempt $((HEALTH_RETRY_COUNT + 1))/$MAX_HEALTH_RETRIES..."
            
            # Get health check response with browser-like headers to bypass WAF
            HEALTH_RESPONSE=$(curl -s --max-time 10 \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36" \
              -H "Accept: application/json, text/plain, */*" \
              -H "Accept-Language: en-US,en;q=0.9" \
              "$HEALTH_ENDPOINT" 2>/dev/null)
            CURL_STATUS=$?
            
            if [ $CURL_STATUS -eq 0 ] && [ -n "$HEALTH_RESPONSE" ]; then
              echo "📡 Health response: $HEALTH_RESPONSE"
              
              # Parse version from JSON response
              DEPLOYED_VERSION=$(echo "$HEALTH_RESPONSE" | jq -r '(.version // .Version // empty)' 2>/dev/null)
              UPTIME=$(echo "$HEALTH_RESPONSE" | jq -r '(.uptime // .Uptime // empty)' 2>/dev/null)
              STATUS=$(echo "$HEALTH_RESPONSE" | jq -r '(.status // .Status // empty)' 2>/dev/null)
              
              if [ -n "$DEPLOYED_VERSION" ] && [ "$STATUS" = "healthy" ]; then
                echo "🏥 Service Status: $STATUS"
                echo "📦 Deployed Version: $DEPLOYED_VERSION"
                echo "⏰ Service Uptime: $UPTIME"
                
                # Check if deployed version matches expected version
                if [[ "$DEPLOYED_VERSION" == *"$BUILDTAG"* ]] || [[ "$BUILDTAG" == *"$DEPLOYED_VERSION"* ]]; then
                  echo "✅ Version verification successful! Deployed version matches expected tag."
                  VERSION_VERIFIED=true
                  break
                else
                  echo "⚠️ Version mismatch - Expected: $BUILDTAG, Deployed: $DEPLOYED_VERSION"
                fi
              else
                echo "⚠️ Service not healthy or version not available"
              fi
            else
              echo "⚠️ Health check failed (curl status: $CURL_STATUS)"
            fi
            
            HEALTH_RETRY_COUNT=$((HEALTH_RETRY_COUNT + 1))
            if [ $HEALTH_RETRY_COUNT -lt $MAX_HEALTH_RETRIES ]; then
              echo "⏳ Waiting 15 seconds before retry..."
              sleep 15
            fi
          done
          set -e
          
          # Final deployment status
          if [ "$VERSION_VERIFIED" = true ]; then
            echo ""
            echo "🎉 Deployment completed successfully!"
            echo "✅ Service is healthy and running the expected version"
            echo "🌐 Health Check URL: $HEALTH_ENDPOINT"
          else
            echo ""
            echo "❌ Deployment verification failed!"
            echo "🔍 The service may still be starting up or there may be an issue"
            echo "🌐 Manual check: $HEALTH_ENDPOINT"
            echo "🏗️  Expected version: $BUILDTAG"
            if [ -n "$DEPLOYED_VERSION" ]; then
              echo "📦 Currently deployed: $DEPLOYED_VERSION"
            fi
            echo ""
            echo "ℹ️ This may be a temporary issue. Check the health endpoint in a few minutes."
            echo "ℹ️ If the issue persists, check AWS ECS console and CloudWatch logs."
            
            # Don't fail the deployment for version mismatch, as it might be a timing issue
            # The ECS service update was successful, version verification is informational
            echo "⚠️ Continuing with warning - ECS deployment completed but version verification inconclusive"
          fi

  Sweep-Zombie-Sessions:
    name: Sweep zombie routed_sessions (post C-Node)
    # Final tactical step: after the C-Node task swap, a batch of routed_sessions
    # rows are left state='OPEN' with a provider mapping the new ephemeral BadgerDB
    # no longer has. The API Gateway self-heals these within ~30 min (failover marks
    # FAILED; its automation loop expires OPEN-past-expires_at), but this job clears
    # the whole batch immediately so users don't eat up to ~30 min of intermittent
    # "provider not found" retries. The Lambda is safe/idempotent (summary-first,
    # refuses a future cutoff, guarded by SWEEP_MAX_ROWS). See Morpheus-Infra
    # 02-morpheus_c_node/.terragrunt/06_routed_sessions_sweep.tf.
    #
    # Runs only after a successful C-Node deploy; tolerates skipped P-Node jobs the
    # same way Deploy-to-Morpheus-C-Node does. Never fails the pipeline on a sweep
    # hiccup - the deploy already succeeded and the gateway self-heals as a backstop.
    if: |
      !cancelled() &&
      github.repository == 'MorpheusAIs/Morpheus-Lumerin-Node' &&
      needs.Deploy-to-Morpheus-C-Node.result == 'success'
    needs:
      - Generate-Tag
      - Deploy-to-Morpheus-C-Node
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.MORPHEUS_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MORPHEUS_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Invoke routed-sessions zombie sweep Lambda
        run: |
          BUILDTAG=${{ needs.Generate-Tag.outputs.tag_name }}

          # Map branch -> environment (same convention as the C-Node deploy).
          if [ "${{ github.ref_name }}" == "test" ]; then
            ENV="dev"
          elif [ "${{ github.ref_name }}" == "main" ]; then
            ENV="prd"
          else
            echo "ℹ️ Branch ${{ github.ref_name }} is not a deploy branch; skipping sweep."
            exit 0
          fi

          FUNCTION_NAME="${ENV}-routed-sessions-sweep"
          CLUSTER_NAME="ecs-${ENV}-morpheus-engine"
          SERVICE_NAME="svc-${ENV}-router"
          # Must match Lambda DEFAULT_REHYDRATION_SECS / DEFAULT_SAFETY_SECS
          # (02-morpheus_c_node/.terragrunt/06_routed_sessions_sweep.tf).
          REHYDRATION_SECS=90
          SAFETY_SECS=120
          SKEW_BUFFER_SECS=15

          # deploy_cutoff mode (default): the Lambda derives cutoff from the
          # C-Node PRIMARY deployment updatedAt + rehydration + safety, then
          # closes OPEN rows older than that. release_tag only annotates
          # error_reason.
          PAYLOAD="{\"release_tag\":\"${BUILDTAG}\"}"

          # Proactive wait: the Lambda REFUSES a future cutoff (would close
          # fresh sessions). Invoking immediately after C-Node settle almost
          # always 400s for ~updatedAt+210s, and the old 10×30s retry budget
          # was barely enough — leaving zombies OPEN long enough to reopen/
          # failover-storm MOR. Sleep until the same cutoff the Lambda will
          # derive, then invoke (small retry loop only for clock skew).
          echo "🔎 Resolving C-Node PRIMARY updatedAt from ${CLUSTER_NAME}/${SERVICE_NAME}..."
          UPDATED_AT=$(aws ecs describe-services \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --query 'services[0].deployments[?status==`PRIMARY`]|[0].updatedAt' \
            --output text)
          if [ -z "$UPDATED_AT" ] || [ "$UPDATED_AT" = "None" ]; then
            echo "⚠️ Could not resolve PRIMARY updatedAt; falling back to fixed ${REHYDRATION_SECS}+${SAFETY_SECS}s wait."
            sleep $((REHYDRATION_SECS + SAFETY_SECS + SKEW_BUFFER_SECS))
          else
            echo "📌 PRIMARY updatedAt: ${UPDATED_AT}"
            UPDATED_EPOCH=$(date -d "$UPDATED_AT" +%s)
            CUTOFF_EPOCH=$((UPDATED_EPOCH + REHYDRATION_SECS + SAFETY_SECS + SKEW_BUFFER_SECS))
            NOW_EPOCH=$(date +%s)
            WAIT_SECS=$((CUTOFF_EPOCH - NOW_EPOCH))
            if [ "$WAIT_SECS" -gt 0 ]; then
              echo "⏳ Waiting ${WAIT_SECS}s for sweep cutoff (updatedAt + ${REHYDRATION_SECS}s + ${SAFETY_SECS}s + ${SKEW_BUFFER_SECS}s skew)..."
              sleep "$WAIT_SECS"
            else
              echo "✅ Cutoff already in the past (${WAIT_SECS}s); invoking immediately."
            fi
          fi

          MAX_ATTEMPTS=5
          SLEEP_SECS=20
          STATUS=""
          BODY=""
          FUNCTION_ERROR=""
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "🧹 [attempt ${attempt}/${MAX_ATTEMPTS}] Invoking ${FUNCTION_NAME} with payload: ${PAYLOAD}"
            set +e
            INVOKE_META=$(aws lambda invoke \
              --function-name "$FUNCTION_NAME" \
              --cli-binary-format raw-in-base64-out \
              --payload "$PAYLOAD" \
              /tmp/sweep_out.json 2>/tmp/sweep_err.txt)
            INVOKE_RC=$?
            set -e

            if [ $INVOKE_RC -ne 0 ]; then
              echo "⚠️ lambda invoke call failed (rc=$INVOKE_RC):"
              cat /tmp/sweep_err.txt || true
              echo "ℹ️ Deploy already succeeded; the API Gateway self-heals zombies within ~30 min. Not failing the pipeline."
              exit 0
            fi

            echo "📡 Invoke metadata: $INVOKE_META"
            FUNCTION_ERROR=$(echo "$INVOKE_META" | jq -r '.FunctionError // empty')
            RESPONSE=$(cat /tmp/sweep_out.json)
            echo "📦 Lambda response: $RESPONSE"

            # The handler returns {"statusCode": N, "body": "<json string>"}.
            STATUS=$(echo "$RESPONSE" | jq -r '.statusCode // empty' 2>/dev/null)
            BODY=$(echo "$RESPONSE" | jq -r '.body // empty' 2>/dev/null)

            # An unhandled Lambda error has no statusCode — terminal, don't retry.
            if [ -n "$FUNCTION_ERROR" ]; then
              break
            fi

            # Retry ONLY residual "future cutoff" 400 (clock skew / ECS lag).
            if [ "$STATUS" = "400" ] && echo "$BODY" | grep -qi "in the future"; then
              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                echo "⏳ Cutoff not reached yet; sleeping ${SLEEP_SECS}s before retry."
                sleep "$SLEEP_SECS"
                continue
              fi
            fi
            break
          done

          {
            echo "### 🧹 Routed-sessions zombie sweep"
            echo ""
            echo "- **Function:** \`${FUNCTION_NAME}\`"
            echo "- **Release tag:** \`${BUILDTAG}\`"
            echo "- **PRIMARY updatedAt:** \`${UPDATED_AT:-unknown}\`"
            echo "- **Handler statusCode:** \`${STATUS:-unknown}\`"
            if [ -n "$BODY" ]; then
              echo ""
              echo "\`\`\`json"
              echo "$BODY"
              echo "\`\`\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$FUNCTION_ERROR" ]; then
            echo "⚠️ Lambda reported FunctionError='$FUNCTION_ERROR'. Check CloudWatch /aws/lambda/${FUNCTION_NAME}."
            echo "ℹ️ Not failing the pipeline; gateway self-heal is the backstop."
            exit 0
          fi

          if [ "$STATUS" = "200" ]; then
            echo "✅ Sweep completed."
          else
            echo "⚠️ Sweep returned non-200 statusCode '${STATUS}' (e.g. future-cutoff or > SWEEP_MAX_ROWS guard)."
            echo "ℹ️ Review the response above and run the runbook sweep manually if needed. Not failing the pipeline."
          fi

  Deploy-to-Morpheus-P-Node:
    name: Deploy to Morpheus Provider via GitHub
    # P-Node-1 roll. On `test` → DEV provider (ecs-dev-morpheus-provider). On `main` →
    # PRD provider (first half of the one-at-a-time HA roll; P-Node-2 follows).
    # Does NOT depend on the C-Node drain: the C-Node stays live during provider
    # rolls so API Gateway failover can keep traffic flowing. Drain runs AFTER
    # providers, right before the C-Node roll (see Drain-Morpheus-C-Node).
    if: |
      github.repository == 'MorpheusAIs/Morpheus-Lumerin-Node' &&
      (needs.changes.outputs.proxy == 'true' || github.event_name == 'workflow_dispatch') &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.build_all_os == 'true' && github.event.inputs.create_deployment == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'))
      )
    needs:
      - changes
      - Generate-Tag
      - GHCR-Build-and-Push
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.MORPHEUS_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MORPHEUS_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Deploy to Morpheus Provider ECS
        run: |
          BUILDTAG=${{ needs.Generate-Tag.outputs.tag_name }}
          BUILDIMAGE=${{ needs.Generate-Tag.outputs.image_name }}
          
          # Determine environment based on branch (same mapping as C-Node)
          if [ "${{ github.ref_name }}" == "test" ]; then
            ENV="dev"
            HEALTH_ENDPOINT="https://providerapi.dev.mor.org/healthcheck"
          elif [ "${{ github.ref_name }}" == "main" ]; then
            ENV="prd"
            HEALTH_ENDPOINT="https://providerapi.mor.org/healthcheck"
          else
            echo "❌ Unsupported branch for provider deployment: ${{ github.ref_name }}"
            exit 1
          fi
          
          echo "🚀 Deploying to Morpheus Provider AWS - Environment: $ENV"
          echo "📦 Container Image: $BUILDIMAGE:$BUILDTAG"
          
          # ECS deployment variables for provider node
          CLUSTER_NAME="ecs-${ENV}-morpheus-provider"
          SERVICE_NAME="svc-${ENV}-provider"
          TASK_FAMILY="tsk-${ENV}-provider"
          CONTAINER_NAME="provider-container"
          
          # Get current task definition
          echo "📋 Retrieving current task definition..."
          CURRENT_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition' \
            --output json)
          
          if [ $? -ne 0 ]; then
            echo "❌ Failed to retrieve current task definition"
            exit 1
          fi
          
          # Update the image in the task definition
          echo "🔄 Creating new task definition with image: $BUILDIMAGE:$BUILDTAG"
          NEW_TASK_DEF=$(echo "$CURRENT_TASK_DEF" | jq --arg IMAGE "$BUILDIMAGE:$BUILDTAG" --arg CONTAINER "$CONTAINER_NAME" '
            {
              family: .family,
              networkMode: .networkMode,
              requiresCompatibilities: .requiresCompatibilities,
              cpu: .cpu,
              memory: .memory,
              taskRoleArn: .taskRoleArn,
              executionRoleArn: .executionRoleArn,
              volumes: .volumes,
              containerDefinitions: (.containerDefinitions | map(
                if .name == $CONTAINER then
                  .image = $IMAGE
                else
                  .
                end
              ))
            }
          ')
          
          # Debug: Check if JSON is valid
          echo "🔍 Validating JSON structure..."
          echo "$NEW_TASK_DEF" | jq empty
          if [ $? -ne 0 ]; then
            echo "❌ Generated JSON is invalid"
            echo "Generated JSON:"
            echo "$NEW_TASK_DEF"
            exit 1
          fi
          
          # Debug: Show task definition summary
          echo "🔍 Task definition summary:"
          echo "$NEW_TASK_DEF" | jq '.family, .cpu, .memory, .networkMode, .requiresCompatibilities, (.containerDefinitions | length)'
          
          # Register new task definition
          echo "📝 Registering new task definition..."
          
          # Save JSON to temporary file to avoid stdin issues
          TEMP_JSON_FILE="/tmp/task_definition_$$.json"
          echo "$NEW_TASK_DEF" > "$TEMP_JSON_FILE"
          
          # Validate the temp file
          jq empty "$TEMP_JSON_FILE"
          if [ $? -ne 0 ]; then
            echo "❌ Temporary file contains invalid JSON"
            rm -f "$TEMP_JSON_FILE"
            exit 1
          fi
          
          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://$TEMP_JSON_FILE" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          # Clean up temp file
          rm -f "$TEMP_JSON_FILE"
          
          if [ $? -ne 0 ] || [ -z "$NEW_TASK_ARN" ]; then
            echo "❌ Failed to register new task definition"
            exit 1
          fi
          
          echo "✅ New task definition registered: $NEW_TASK_ARN"
          
          # Update the ECS service
          echo "🔄 Updating ECS service..."
          UPDATE_RESULT=$(aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --task-definition "$NEW_TASK_ARN" \
            --force-new-deployment \
            --query 'service.{serviceName:serviceName,taskDefinition:taskDefinition,desiredCount:desiredCount,runningCount:runningCount,pendingCount:pendingCount}' \
            --output json)
          
          echo "📊 Service Update Summary:"
          echo "$UPDATE_RESULT" | jq .
          
          if [ $? -ne 0 ]; then
            echo "❌ Failed to update ECS service"
            exit 1
          fi
          
          echo "✅ ECS service update initiated successfully"
          echo "🎯 Environment: $ENV"
          echo "🏗️  Cluster: $CLUSTER_NAME"
          echo "⚙️  Service: $SERVICE_NAME"
          echo "📦 Image: $BUILDIMAGE:$BUILDTAG"
          echo "📋 Task Definition: $NEW_TASK_ARN"
          
          # Wait for deployment to stabilize
          # P-Node ECS lifecycle: stopTimeout + ALB drain + health checks can take several minutes.
          # Enforce a 180s floor so health-check retries aren't wasted on the old task.
          DEPLOY_WAIT_FLOOR_SECS=180
          echo "⏳ Waiting for ECS service to stabilize (default waiter: up to 10 min at 40×15s)..."
          WAIT_START=$(date +%s)
          set +e
          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --cli-read-timeout 900 \
            --cli-connect-timeout 60
          STABILIZATION_STATUS=$?
          WAIT_ELAPSED=$(( $(date +%s) - WAIT_START ))
          set -e
          
          if [ $STABILIZATION_STATUS -eq 0 ]; then
            echo "✅ ECS service stabilized after ${WAIT_ELAPSED}s"
          else
            echo "⚠️ ECS wait returned status $STABILIZATION_STATUS after ${WAIT_ELAPSED}s, continuing with health check..."
          fi
          
          REMAINING=$(( DEPLOY_WAIT_FLOOR_SECS - WAIT_ELAPSED ))
          if [ $REMAINING -gt 0 ]; then
            echo "⏳ Ensuring minimum ${DEPLOY_WAIT_FLOOR_SECS}s deploy wait (sleeping ${REMAINING}s more)..."
            sleep $REMAINING
          fi
          
          # HEALTH_ENDPOINT set above from branch → env mapping
          echo "🔍 Verifying deployment version at: $HEALTH_ENDPOINT"
          
          # Wait for the service to be reachable and verify version
          MAX_HEALTH_RETRIES=20
          HEALTH_RETRY_COUNT=0
          VERSION_VERIFIED=false
          
          # Disable errexit for the health-check loop so curl timeouts (exit 28) don't kill the script
          set +e
          while [ $HEALTH_RETRY_COUNT -lt $MAX_HEALTH_RETRIES ]; do
            echo "🔄 Health check attempt $((HEALTH_RETRY_COUNT + 1))/$MAX_HEALTH_RETRIES..."
            
            # Get health check response with browser-like headers to bypass WAF
            HEALTH_RESPONSE=$(curl -s --max-time 10 \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36" \
              -H "Accept: application/json, text/plain, */*" \
              -H "Accept-Language: en-US,en;q=0.9" \
              "$HEALTH_ENDPOINT" 2>/dev/null)
            CURL_STATUS=$?
            
            if [ $CURL_STATUS -eq 0 ] && [ -n "$HEALTH_RESPONSE" ]; then
              echo "📡 Health response: $HEALTH_RESPONSE"
              
              # Parse version from JSON response
              DEPLOYED_VERSION=$(echo "$HEALTH_RESPONSE" | jq -r '(.version // .Version // empty)' 2>/dev/null)
              UPTIME=$(echo "$HEALTH_RESPONSE" | jq -r '(.uptime // .Uptime // empty)' 2>/dev/null)
              STATUS=$(echo "$HEALTH_RESPONSE" | jq -r '(.status // .Status // empty)' 2>/dev/null)
              
              if [ -n "$DEPLOYED_VERSION" ] && [ "$STATUS" = "healthy" ]; then
                echo "🏥 Service Status: $STATUS"
                echo "📦 Deployed Version: $DEPLOYED_VERSION"
                echo "⏰ Service Uptime: $UPTIME"
                
                # Check if deployed version matches expected version
                if [[ "$DEPLOYED_VERSION" == *"$BUILDTAG"* ]] || [[ "$BUILDTAG" == *"$DEPLOYED_VERSION"* ]]; then
                  echo "✅ Version verification successful! Deployed version matches expected tag."
                  VERSION_VERIFIED=true
                  break
                else
                  echo "⚠️ Version mismatch - Expected: $BUILDTAG, Deployed: $DEPLOYED_VERSION"
                fi
              else
                echo "⚠️ Service not healthy or version not available"
              fi
            else
              echo "⚠️ Health check failed (curl status: $CURL_STATUS)"
            fi
            
            HEALTH_RETRY_COUNT=$((HEALTH_RETRY_COUNT + 1))
            if [ $HEALTH_RETRY_COUNT -lt $MAX_HEALTH_RETRIES ]; then
              echo "⏳ Waiting 15 seconds before retry..."
              sleep 15
            fi
          done
          set -e
          
          # Final deployment status
          if [ "$VERSION_VERIFIED" = true ]; then
            echo ""
            echo "🎉 Deployment completed successfully!"
            echo "✅ Service is healthy and running the expected version"
            echo "🌐 Health Check URL: $HEALTH_ENDPOINT"
          else
            echo ""
            echo "❌ Deployment verification failed!"
            echo "🔍 The service may still be starting up or there may be an issue"
            echo "🌐 Manual check: $HEALTH_ENDPOINT"
            echo "🏗️  Expected version: $BUILDTAG"
            if [ -n "$DEPLOYED_VERSION" ]; then
              echo "📦 Currently deployed: $DEPLOYED_VERSION"
            fi
            echo ""
            echo "ℹ️ This may be a temporary issue. Check the health endpoint in a few minutes."
            echo "ℹ️ If the issue persists, check AWS ECS console and CloudWatch logs."
            
            # Don't fail the deployment for version mismatch, as it might be a timing issue
            # The ECS service update was successful, version verification is informational
            echo "⚠️ Continuing with warning - ECS deployment completed but version verification inconclusive"
          fi

  Deploy-to-Morpheus-P-Node-2:
    name: Deploy to Morpheus Provider 2 via GitHub
    # Second half of the one-at-a-time provider roll. Strictly SEQUENTIAL after
    # P-Node-1: `needs: Deploy-to-Morpheus-P-Node` + the implicit success() gate means
    # this only starts once P-Node-1's new task is healthy and version-verified, so we
    # never have both providers down at once (each service rolls stop-old-then-start-new
    # via deployment_minimum_healthy_percent=0). Same shared models-config as P-Node-1
    # but its own ECS service, EFS, wallet and on-chain identity (see
    # Morpheus-Infra/environments/02-morpheus_p_node/.terragrunt/05_provider2.tf,
    # gated on switches.provider2). Main/prd only.
    if: |
      github.repository == 'MorpheusAIs/Morpheus-Lumerin-Node' &&
      (needs.changes.outputs.proxy == 'true' || github.event_name == 'workflow_dispatch') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.build_all_os == 'true' && github.event.inputs.create_deployment == 'true' && github.ref == 'refs/heads/main')
      )
    needs:
      - changes
      - Generate-Tag
      - GHCR-Build-and-Push
      - Deploy-to-Morpheus-P-Node
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.MORPHEUS_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.MORPHEUS_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Deploy to Morpheus Provider 2 ECS
        run: |
          BUILDTAG=${{ needs.Generate-Tag.outputs.tag_name }}
          BUILDIMAGE=${{ needs.Generate-Tag.outputs.image_name }}
          
          # Provider node only exists in production environment
          ENV="prd"
          
          echo "🚀 Deploying to Morpheus Provider 2 AWS - Environment: $ENV"
          echo "📦 Container Image: $BUILDIMAGE:$BUILDTAG"
          
          # ECS deployment variables for provider2 (HA second node, shared cluster)
          CLUSTER_NAME="ecs-${ENV}-morpheus-provider"
          SERVICE_NAME="svc-${ENV}-provider2"
          TASK_FAMILY="tsk-${ENV}-provider2"
          CONTAINER_NAME="provider2-container"
          
          # Get current task definition
          echo "📋 Retrieving current task definition..."
          CURRENT_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition' \
            --output json)
          
          if [ $? -ne 0 ]; then
            echo "❌ Failed to retrieve current task definition"
            exit 1
          fi
          
          # Update the image in the task definition
          echo "🔄 Creating new task definition with image: $BUILDIMAGE:$BUILDTAG"
          NEW_TASK_DEF=$(echo "$CURRENT_TASK_DEF" | jq --arg IMAGE "$BUILDIMAGE:$BUILDTAG" --arg CONTAINER "$CONTAINER_NAME" '
            {
              family: .family,
              networkMode: .networkMode,
              requiresCompatibilities: .requiresCompatibilities,
              cpu: .cpu,
              memory: .memory,
              taskRoleArn: .taskRoleArn,
              executionRoleArn: .executionRoleArn,
              volumes: .volumes,
              containerDefinitions: (.containerDefinitions | map(
                if .name == $CONTAINER then
                  .image = $IMAGE
                else
                  .
                end
              ))
            }
          ')
          
          # Debug: Check if JSON is valid
          echo "🔍 Validating JSON structure..."
          echo "$NEW_TASK_DEF" | jq empty
          if [ $? -ne 0 ]; then
            echo "❌ Generated JSON is invalid"
            echo "Generated JSON:"
            echo "$NEW_TASK_DEF"
            exit 1
          fi
          
          # Debug: Show task definition summary
          echo "🔍 Task definition summary:"
          echo "$NEW_TASK_DEF" | jq '.family, .cpu, .memory, .networkMode, .requiresCompatibilities, (.containerDefinitions | length)'
          
          # Register new task definition
          echo "📝 Registering new task definition..."
          
          # Save JSON to temporary file to avoid stdin issues
          TEMP_JSON_FILE="/tmp/task_definition_$$.json"
          echo "$NEW_TASK_DEF" > "$TEMP_JSON_FILE"
          
          # Validate the temp file
          jq empty "$TEMP_JSON_FILE"
          if [ $? -ne 0 ]; then
            echo "❌ Temporary file contains invalid JSON"
            rm -f "$TEMP_JSON_FILE"
            exit 1
          fi
          
          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://$TEMP_JSON_FILE" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          # Clean up temp file
          rm -f "$TEMP_JSON_FILE"
          
          if [ $? -ne 0 ] || [ -z "$NEW_TASK_ARN" ]; then
            echo "❌ Failed to register new task definition"
            exit 1
          fi
          
          echo "✅ New task definition registered: $NEW_TASK_ARN"
          
          # Update the ECS service
          echo "🔄 Updating ECS service..."
          UPDATE_RESULT=$(aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --task-definition "$NEW_TASK_ARN" \
            --force-new-deployment \
            --query 'service.{serviceName:serviceName,taskDefinition:taskDefinition,desiredCount:desiredCount,runningCount:runningCount,pendingCount:pendingCount}' \
            --output json)
          
          echo "📊 Service Update Summary:"
          echo "$UPDATE_RESULT" | jq .
          
          if [ $? -ne 0 ]; then
            echo "❌ Failed to update ECS service"
            exit 1
          fi
          
          echo "✅ ECS service update initiated successfully"
          echo "🎯 Environment: $ENV"
          echo "🏗️  Cluster: $CLUSTER_NAME"
          echo "⚙️  Service: $SERVICE_NAME"
          echo "📦 Image: $BUILDIMAGE:$BUILDTAG"
          echo "📋 Task Definition: $NEW_TASK_ARN"
          
          # Wait for deployment to stabilize
          # P-Node ECS lifecycle: stopTimeout + ALB drain + health checks can take several minutes.
          # Enforce a 180s floor so health-check retries aren't wasted on the old task.
          DEPLOY_WAIT_FLOOR_SECS=180
          echo "⏳ Waiting for ECS service to stabilize (default waiter: up to 10 min at 40×15s)..."
          WAIT_START=$(date +%s)
          set +e
          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --cli-read-timeout 900 \
            --cli-connect-timeout 60
          STABILIZATION_STATUS=$?
          WAIT_ELAPSED=$(( $(date +%s) - WAIT_START ))
          set -e
          
          if [ $STABILIZATION_STATUS -eq 0 ]; then
            echo "✅ ECS service stabilized after ${WAIT_ELAPSED}s"
          else
            echo "⚠️ ECS wait returned status $STABILIZATION_STATUS after ${WAIT_ELAPSED}s, continuing with health check..."
          fi
          
          REMAINING=$(( DEPLOY_WAIT_FLOOR_SECS - WAIT_ELAPSED ))
          if [ $REMAINING -gt 0 ]; then
            echo "⏳ Ensuring minimum ${DEPLOY_WAIT_FLOOR_SECS}s deploy wait (sleeping ${REMAINING}s more)..."
            sleep $REMAINING
          fi
          
          # Provider2 node health endpoint
          HEALTH_ENDPOINT="https://provider2api.mor.org/healthcheck"
          
          echo "🔍 Verifying deployment version at: $HEALTH_ENDPOINT"
          
          # Wait for the service to be reachable and verify version
          MAX_HEALTH_RETRIES=20
          HEALTH_RETRY_COUNT=0
          VERSION_VERIFIED=false
          
          # Disable errexit for the health-check loop so curl timeouts (exit 28) don't kill the script
          set +e
          while [ $HEALTH_RETRY_COUNT -lt $MAX_HEALTH_RETRIES ]; do
            echo "🔄 Health check attempt $((HEALTH_RETRY_COUNT + 1))/$MAX_HEALTH_RETRIES..."
            
            # Get health check response with browser-like headers to bypass WAF
            HEALTH_RESPONSE=$(curl -s --max-time 10 \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36" \
              -H "Accept: application/json, text/plain, */*" \
              -H "Accept-Language: en-US,en;q=0.9" \
              "$HEALTH_ENDPOINT" 2>/dev/null)
            CURL_STATUS=$?
            
            if [ $CURL_STATUS -eq 0 ] && [ -n "$HEALTH_RESPONSE" ]; then
              echo "📡 Health response: $HEALTH_RESPONSE"
              
              # Parse version from JSON response
              DEPLOYED_VERSION=$(echo "$HEALTH_RESPONSE" | jq -r '(.version // .Version // empty)' 2>/dev/null)
              UPTIME=$(echo "$HEALTH_RESPONSE" | jq -r '(.uptime // .Uptime // empty)' 2>/dev/null)
              STATUS=$(echo "$HEALTH_RESPONSE" | jq -r '(.status // .Status // empty)' 2>/dev/null)
              
              if [ -n "$DEPLOYED_VERSION" ] && [ "$STATUS" = "healthy" ]; then
                echo "🏥 Service Status: $STATUS"
                echo "📦 Deployed Version: $DEPLOYED_VERSION"
                echo "⏰ Service Uptime: $UPTIME"
                
                # Check if deployed version matches expected version
                if [[ "$DEPLOYED_VERSION" == *"$BUILDTAG"* ]] || [[ "$BUILDTAG" == *"$DEPLOYED_VERSION"* ]]; then
                  echo "✅ Version verification successful! Deployed version matches expected tag."
                  VERSION_VERIFIED=true
                  break
                else
                  echo "⚠️ Version mismatch - Expected: $BUILDTAG, Deployed: $DEPLOYED_VERSION"
                fi
              else
                echo "⚠️ Service not healthy or version not available"
              fi
            else
              echo "⚠️ Health check failed (curl status: $CURL_STATUS)"
            fi
            
            HEALTH_RETRY_COUNT=$((HEALTH_RETRY_COUNT + 1))
            if [ $HEALTH_RETRY_COUNT -lt $MAX_HEALTH_RETRIES ]; then
              echo "⏳ Waiting 15 seconds before retry..."
              sleep 15
            fi
          done
          set -e
          
          # Final deployment status
          if [ "$VERSION_VERIFIED" = true ]; then
            echo ""
            echo "🎉 Deployment completed successfully!"
            echo "✅ Service is healthy and running the expected version"
            echo "🌐 Health Check URL: $HEALTH_ENDPOINT"
          else
            echo ""
            echo "❌ Deployment verification failed!"
            echo "🔍 The service may still be starting up or there may be an issue"
            echo "🌐 Manual check: $HEALTH_ENDPOINT"
            echo "🏗️  Expected version: $BUILDTAG"
            if [ -n "$DEPLOYED_VERSION" ]; then
              echo "📦 Currently deployed: $DEPLOYED_VERSION"
            fi
            echo ""
            echo "ℹ️ This may be a temporary issue. Check the health endpoint in a few minutes."
            echo "ℹ️ If the issue persists, check AWS ECS console and CloudWatch logs."
            
            # Don't fail the deployment for version mismatch, as it might be a timing issue
            # The ECS service update was successful, version verification is informational
            echo "⚠️ Continuing with warning - ECS deployment completed but version verification inconclusive"
          fi

  UI-macOS-latest-arm64:
    name: Build Morpheus UI macOS-arm64 Image
    if: |
      github.repository == 'MorpheusAIs/Morpheus-Lumerin-Node' &&
      (needs.changes.outputs.ui == 'true' || needs.changes.outputs.proxy == 'true') &&
      (
        (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/cicd/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.build_all_os == 'true')
      )
    runs-on: macos-latest
    needs:
      - changes
      - Generate-Tag
    env:
      SERVICE_PROXY_DOWNLOAD_URL_MAC_ARM64: ${{ needs.Generate-Tag.outputs.anchor_artifacts_base_url }}/mac-arm64-morpheus-router-${{ needs.Generate-Tag.outputs.anchor_vfull }}
    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "yarn"
          cache-dependency-path: ui-desktop/yarn.lock

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('ui-desktop/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: |
          cd ./ui-desktop
          brew install python-setuptools
          yarn install --network-timeout 600000 --frozen-lockfile

      - name: Copy Environment Files
        uses: ./.github/actions/copy_env_files

      - name: Build
        id: build
        run: |
          FULLTAG=${{ needs.Generate-Tag.outputs.vfull }}
          cd ./ui-desktop
          echo "Injecting version $FULLTAG into package.json"
          sed -i "" "s/\"version\": \".*\"/\"version\": \"$FULLTAG\"/" package.json
          cat package.json | grep '"version"'  # Optional: Verify the change
          yarn build:mac-arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: ./ui-desktop/dist/mac-arm64-morpheus-app-${{ needs.Generate-Tag.outputs.vfull }}.dmg
          name: mac-arm64-morpheus-app-${{ needs.Generate-Tag.outputs.vfull }}.dmg

