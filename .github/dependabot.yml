# Version updates open against `dev` (integration branch).
# Security updates still target the repository default branch (`main`);
# retarget or batch those into `dev` as today.
# See: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#target-branch-
#
# Patch + minor are grouped per directory so weekly runs open ~1 PR each,
# not one PR per package. Majors stay ungrouped for deliberate human review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /ui-desktop
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      ui-desktop-patch-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      docs-patch-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /smart-contracts
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      smart-contracts-patch-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
